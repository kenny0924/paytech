server:
  address: 127.0.0.1
  port: 18102
  servlet:
    context-path: /commerce

spring:
  application:
    name: commerce-service
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:public}"
    loadbalancer:
      retry:
        enabled: false
      cache:
        enabled: false
  http:
    clients:
      imperative:
        factory: http-components
    serviceclient:
      payment-orchestration-service:
        base-url: lb://payment-orchestration-service/payment
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      client-contract-service:
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      risk-service:
        base-url: lb://risk-service
        connect-timeout: 2s
        read-timeout: 1s
        redirects: dont-follow
  data:
    redis:
      host: "${MOR_REDIS_HOST:127.0.0.1}"
      port: "${MOR_REDIS_PORT:16379}"
      password: "${MOR_REDIS_PASSWORD:}"
      database: 0
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: "${MOR_COMMERCE_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${MOR_COMMERCE_DB_USERNAME:commerce_app}"
    password: "${MOR_COMMERCE_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  sql:
    init:
      mode: never
  # Payment 支付结果消费（cg_commerce_payment_result）；凭据只从环境变量注入。
  rabbitmq:
    host: "${COMMERCE_RABBITMQ_HOST:127.0.0.1}"
    port: "${COMMERCE_RABBITMQ_PORT:5672}"
    username: "${COMMERCE_RABBITMQ_USERNAME:}"
    password: "${COMMERCE_RABBITMQ_PASSWORD:}"
    virtual-host: "${COMMERCE_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
  jmx:
    enabled: false

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

redis:
  coordination:
    enabled: true

command-idempotency:
  enabled: true

commerce:
  payment:
    card-payment-method-code: "${COMMERCE_CARD_PAYMENT_METHOD_CODE}"
  checkout:
    public-origin: "${COMMERCE_CHECKOUT_PUBLIC_ORIGIN}"
  identifier:
    region-id: "${COMMERCE_SNOWFLAKE_REGION_ID}"
    worker-id: "${COMMERCE_SNOWFLAKE_WORKER_ID}"

web:
  logging:
    metadata-only-path-prefixes:
      - /client-gateway-api/v1
      - /customer-gateway-api/v1

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
