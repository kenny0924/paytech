# Commerce 配置字段清单，同时作为 Mock 测试的可运行配置。

# ==================== 中间件、框架与公共组件配置 ====================


server:
  address: 127.0.0.1
  port: 0
  servlet:
    context-path: /commerce

spring:
  application:
    name: commerce-service
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
        server-addr: "127.0.0.1:8848"
        namespace: public
    discovery:
      client:
        simple:
          instances:
            payment-orchestration-service:
              - uri: "${commerce.test.external.base-url}"
            client-contract-service:
              - uri: "${commerce.test.external.base-url}"
    loadbalancer:
      retry:
        enabled: false
      cache:
        enabled: false
  http:
    clients:
      imperative:
        factory: http-components
    serviceclient:
      payment-orchestration-service:
        base-url: lb://payment-orchestration-service/payment
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      client-contract-service:
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
  data:
    redis:
      host: "127.0.0.1"
      port: 16379
      password: "${COMMERCE_TEST_REDIS_PASSWORD:${MOR_REDIS_PASSWORD:c4e99fe36176a66ece55b0c23e5af0be488d409f2e89f6c5}}"
      database: 0
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: "jdbc:mysql://127.0.0.1:13306/mor_commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: commerce_app
    password: "${COMMERCE_TEST_DB_PASSWORD:local-commerce-change-me-2026}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

redis:
  key-prefix: "commerce-test-${random.uuid}"
  coordination:
    enabled: true
    threads: 4
    netty-threads: 4
    connection-minimum-idle-size: 1
    connection-pool-size: 16
    subscription-connection-minimum-idle-size: 1
    subscription-connection-pool-size: 8

command-idempotency:
  enabled: false

compensation:
  enabled: true
  instance-id: "${spring.application.name}"
  lease-duration: 2m
  scanner-batch-size: 100
  coordinator:
    core-size: 10
    maximum-size: 20
    queue-capacity: 80
    keep-alive: 60s
  handler:
    maximum-concurrency: 20

xxl:
  job:
    admin:
      addresses: ""
      access-token: ""
      timeout: 3
    executor:
      enabled: false
      app-name: commerce-service
      address: ""
      ip: ""
      port: 0
      log-path: ./logs/xxl-job
      log-retention-days: 30
      excluded-packages: "org.springframework.,spring."

web:
  logging:
    metadata-only-path-prefixes:
      - /client-gateway-api/v1
      - /customer-gateway-api/v1

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    db:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
# ==================== Commerce 系统自定义配置 ====================

# Commerce 自有业务配置，字段完整对应自有 Properties 类；这些值修改后均需重启。
commerce:
  payment:
    card-payment-method-code: CARD_TEST
  checkout:
    # 无代码默认值，必填 HTTPS Origin；不含凭据、路径、查询、片段或尾斜线。
    # 只影响之后创建的 Session，历史 Session 保留原值；此处为本地测试站点。
    public-origin: https://checkout.local.test
  identifier:
    # 两者均无代码默认值且必填，范围 0～31；同一区域内 worker-id 必须每实例唯一。
    region-id: 0
    worker-id: 0
  test:
    external:
      # 测试专用运行时字段；EnableMockHttpServer 自动注册 Loopback 随机端口。
      # 上方 SimpleDiscovery 引用本字段；不是生产配置，也不需手工提供环境变量。
      base-url: ""
