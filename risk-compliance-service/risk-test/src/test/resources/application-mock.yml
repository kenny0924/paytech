# Risk 配置字段清单，同时作为 MockTestBase（mock Profile）的可运行配置。
# 本文件列全 Risk 自定义配置、已接入公共组件的配置及实际使用的框架配置；配置字段变化必须同步本文件。
# 本地中间件密码不入库：由 RISK_TEST_* 或 local-environment/.env.local 导出的 MOR_* 环境变量注入；用户名与 vhost 使用 .env.example 公开默认值。

# ==================== 中间件、框架与公共组件配置 ====================

server:
  address: 127.0.0.1
  # 测试使用随机端口
  port: 0

spring:
  application:
    name: risk-service
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  sql:
    init:
      mode: never
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false
        server-addr: "127.0.0.1:8848"
        namespace: mor-local
        ip: 127.0.0.1
  datasource:
    url: "jdbc:mysql://127.0.0.1:13306/mor_risk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: risk_app
    password: "${RISK_TEST_DB_PASSWORD:${MOR_RISK_DB_PASSWORD:}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        connectTimeout: 2000
        socketTimeout: 2000
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: "${RISK_TEST_REDIS_PASSWORD:${MOR_REDIS_PASSWORD:}}"
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: "${RISK_TEST_RABBITMQ_USERNAME:${MOR_RABBITMQ_USER:mor_local}}"
    password: "${RISK_TEST_RABBITMQ_PASSWORD:${MOR_RABBITMQ_PASSWORD:}}"
    virtual-host: "${RISK_TEST_RABBITMQ_VHOST:${MOR_RABBITMQ_VHOST:/mor-local}}"
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-missing-creator-properties: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

# paytech-mvc-web-starter：这些路径只记录请求元数据，不记录 Body。
web:
  logging:
    metadata-only-path-prefixes:
      - /internal/due-diligence/material-requirements
      - /client-onboarding-review
      - /client-onboarding-admin
      - /decision-dictionaries
      - /decision-rule-sets
      - /decision-releases
      - /decision-flows
      - /decision-variables

# paytech-redis-starter
redis:
  # 测试专用 Key 前缀，与开发数据隔离；生产缺省使用 spring.application.name。
  key-prefix: risk-mock
  coordination:
    enabled: true
    threads: 4
    netty-threads: 4
    connection-minimum-idle-size: 1
    connection-pool-size: 16
    subscription-connection-minimum-idle-size: 1
    subscription-connection-pool-size: 8
    resource-lock:
      # 注解锁的服务级等待/租约；模板锁参数由 LockCommand 显式提供，不读取此处。
      wait-time: 500ms
      lease-time: 30s

# paytech-compensation-event：本地补偿任务，事务内登记、提交后执行。
compensation:
  enabled: true
  # 多实例 Claim/Lease 的实例标识；测试固定值。
  instance-id: risk-mock
  # 单次 Claim 的租约时长。
  lease-duration: 2m
  # 兜底扫描单批条数。
  scanner-batch-size: 100
  coordinator:
    core-size: 10
    maximum-size: 20
    queue-capacity: 80
    keep-alive: 60s
  handler:
    maximum-concurrency: 20

# paytech-xxl-job-starter（随 compensation-event 引入）：测试不连接调度中心。
xxl:
  job:
    admin:
      addresses: ""
      access-token: ""
      timeout: 3
    executor:
      enabled: false
      app-name: risk-service
      address: ""
      ip: 127.0.0.1
      port: 0
      log-path: ./logs/xxl-job
      log-retention-days: 30
      excluded-packages: "org.springframework.,spring."

# ==================== Risk 自定义配置 ====================

decision:
  identifier:
    # Snowflake 区域与节点号；生产必须由部署注入，测试固定为 0。
    region-id: 0
    worker-id: 0

onboarding:
  review:
    # I01/I02 审核入口与 /client-onboarding-admin 管理入口开关，默认关闭；相关测试类显式开启。
    enabled: false
  materials:
    # 材料目录入口开关，默认关闭；相关测试类显式开启。
    enabled: false
    # 资格类型到通用材料程序的映射 JSON；每类最多一行，测试可在用例内覆盖。
    programs-json: '[{"qualificationType":"INDIVIDUAL_KYC","programCode":"CLIENT_INDIVIDUAL_GENERIC"},{"qualificationType":"ORGANIZATION_KYB","programCode":"CLIENT_ORGANIZATION_GENERIC"},{"qualificationType":"RELATED_PERSON_KYC","programCode":"RELATED_PERSON_GENERIC"}]'
