server:
  address: 127.0.0.1
  port: 18104

spring:
  application:
    name: risk-service
  data:
    redis:
      host: "${RISK_REDIS_HOST:127.0.0.1}"
      port: "${RISK_REDIS_PORT:16379}"
      password: "${RISK_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:mor-local}
        ip: ${SPRING_CLOUD_NACOS_DISCOVERY_IP:${SERVER_ADDRESS:127.0.0.1}}
  datasource:
    url: "${RISK_DB_URL}"
    username: "${RISK_DB_USERNAME}"
    password: "${RISK_DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        connectTimeout: 2000
        socketTimeout: 2000
  rabbitmq:
    host: "${RISK_RABBITMQ_HOST:127.0.0.1}"
    port: "${RISK_RABBITMQ_PORT:5672}"
    username: "${RISK_RABBITMQ_USERNAME:}"
    password: "${RISK_RABBITMQ_PASSWORD:}"
    virtual-host: "${RISK_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    # 发布确认与不可路由退回：补偿 Handler 等待 Broker 确认后才算发布成功。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-missing-creator-properties: false
  jmx:
    enabled: false
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

decision:
  identifier:
    region-id: "${RISK_SNOWFLAKE_REGION_ID}"
    worker-id: "${RISK_SNOWFLAKE_WORKER_ID}"
  runtime:
    # 本实例的发布环境 TEST 或 PRODUCTION；支付评估读取该环境的生效发布，执行发布只允许在 TEST 激活。必填。
    environment: "${RISK_DECISION_ENVIRONMENT}"

web:
  logging:
    metadata-only-path-prefixes:
      - /internal/due-diligence/material-requirements
      # I01 请求体含主体姓名、证件号与地址原值，只记元数据。
      - /client-onboarding-review
      # 审核命令含内部理由与客户可见说明，只记元数据。
      - /client-onboarding-admin
      - /decision-dictionaries
      - /decision-rule-sets
      - /decision-releases
      - /decision-flows
      - /decision-variables
      # 名单主体值与支付评估输入含 IP、卡指纹等受限原值，只记元数据。
      - /risk-lists
      - /payment-risk-assessment

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

# 本地补偿任务：审核结果在本地事务登记，提交后由 Handler 发布到 RabbitMQ。
compensation:
  enabled: true

redis:
  coordination:
    enabled: true
    resource-lock:
      wait-time: 500ms
      lease-time: 30s

# Client 入驻通用材料目录：每类资格一个全局程序，不按国家区分；材料充分性由人工审核判断。
# 程序数据由 requirements/20260914/client-console-注册与客户入驻/db/implementation/risk-generic-materials-init.sql 手工初始化。
onboarding:
  # I01 审核登记入口（CCT 私网调用）；默认关闭。
  review:
    enabled: false
  materials:
    enabled: false
    programs-json: '[{"qualificationType":"INDIVIDUAL_KYC","programCode":"CLIENT_INDIVIDUAL_GENERIC"},{"qualificationType":"ORGANIZATION_KYB","programCode":"CLIENT_ORGANIZATION_GENERIC"},{"qualificationType":"RELATED_PERSON_KYC","programCode":"RELATED_PERSON_GENERIC"}]'
