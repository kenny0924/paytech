# Data ID: payment-orchestration-service.yaml
# Namespace: 按环境选择；本地为 mor-local。Group: DEFAULT_GROUP。
# 本地参数模板；上传前按目标环境调整。密码和实例 Snowflake 坐标由进程环境提供。

server:
  address: 127.0.0.1
  port: 18103
  servlet:
    context-path: /payment

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/mor_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: payment_app
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      connect-timeout: 2s
      timeout: 2s

redis:
  coordination:
    enabled: true
    resource-lock:
      wait-time: 500ms
      lease-time: 30s

payment:
  channel:
    capability-definitions:
      "[ACTION.PAY]": { value-type: BOOLEAN }
      "[ACTION.AUTHORIZE]": { value-type: BOOLEAN }
      "[ACTION.AUTHENTICATE]": { value-type: BOOLEAN }
      "[ACTION.CAPTURE]": { value-type: BOOLEAN }
      "[ACTION.VOID]": { value-type: BOOLEAN }
      "[ACTION.REFUND]": { value-type: BOOLEAN }
      "[AMOUNT.MIN]": { value-type: DECIMAL }
      "[AMOUNT.MAX]": { value-type: DECIMAL }
      "[SECURITY.3DS_MODE]": { value-type: CODE, allowed-codes: [REQUIRED, SUPPORTED, UNSUPPORTED] }
  execution:
    # 零值禁用新申请；本地合成流程可配置 PT5M，实际期限受 Intent/Card 限制。
    instrument-preparation-window: PT0S
  # card.fingerprint-key（卡指纹与凭证摘要的 HMAC 密钥）必填但不写入模板或 Nacos，由环境变量 PAYMENT_CARD_FINGERPRINT_KEY 提供；
  # 每张卡的数据加密密钥由 Vault 托管（数据类型 PAYMENT_CARD_DEK），不在 Payment 配置。
  outbound:
    # Platform 标准 API 执行与 Risk 统一评估的对方 context path 与读取超时；修改需重启。
    platform-context-path: /platform-support
    platform-read-timeout: 30s
    risk-context-path: ""
    # Risk 读超时后用同一请求重试一次，仍失败则风控失败关闭。
    risk-read-timeout: 1s

vault:
  client:
    caller-service: payment-orchestration-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 5s
