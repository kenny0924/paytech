server:
  address: 127.0.0.1
  port: 18110

spring:
  application:
    name: channel-connector-service
  cloud:
    nacos:
      config:
        # 启用 nacos Profile 后，从配置中心加载服务配置。
        enabled: false
      discovery:
        # 注册本服务（Payment 经服务发现调用）并发现 Platform、Vault；地址与命名空间由部署环境注入。
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:mor-local}"
  datasource:
    url: "${MOR_CHANNEL_CONNECTOR_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_channel_connector?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${MOR_CHANNEL_CONNECTOR_DB_USERNAME:channel_connector_app}"
    password: "${MOR_CHANNEL_CONNECTOR_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: "SET time_zone = '+00:00'"
  sql:
    init:
      mode: never
  jmx:
    enabled: false

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}] %kvp"

web:
  logging:
    # 渠道操作输入含支付工具 Token，输出含临时跳转地址：均不进入普通访问日志。
    metadata-only-path-prefixes:
      - /

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

# 实例 ID（实例清单 instance.id，01 §5）：内部调用 Token 的 inst；internal-auth.mode 非 OFF 时必填。
paytech:
  instance-id: "${PAYTECH_INSTANCE_ID:}"

# 内部调用身份（D26）：默认 OFF；YAML 中必须带引号，裸 OFF 会被解析为布尔 false。
internal-auth:
  mode: "${CHANNEL_CONNECTOR_INTERNAL_AUTH_MODE:OFF}"

channel-connector:
  # 能力代码目录：未注册的能力代码失败关闭；能力代码只在本服务解析（D06）。
  capability-definitions:
    "[ACTION.PAY]": { value-type: BOOLEAN }
    "[ACTION.AUTHORIZE]": { value-type: BOOLEAN }
    "[ACTION.AUTHENTICATE]": { value-type: BOOLEAN }
    "[ACTION.CAPTURE]": { value-type: BOOLEAN }
    "[ACTION.VOID]": { value-type: BOOLEAN }
    "[ACTION.REFUND]": { value-type: BOOLEAN }
    "[AMOUNT.MIN]": { value-type: DECIMAL }
    "[AMOUNT.MAX]": { value-type: DECIMAL }
    "[SECURITY.3DS_MODE]": { value-type: CODE, allowed-codes: [REQUIRED, SUPPORTED, UNSUPPORTED] }
  outbound:
    # Platform 标准 API 执行的对方 context path 与读取超时；修改需重启。
    platform-context-path: /platform-support
    platform-read-timeout: 30s

vault:
  client:
    caller-service: channel-connector-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 5s

management:
  server:
    port: 19110
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
    info:
      access: read-only
    prometheus:
      access: read-only

---
spring:
  config:
    activate:
      on-profile: nacos
    import:
      - "optional:nacos:mor-common.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=false"
      - "nacos:channel-connector-service.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:mor-local}"
        group: "${NACOS_GROUP:DEFAULT_GROUP}"
        username: "${NACOS_USERNAME:}"
        password: "${NACOS_PASSWORD:}"
