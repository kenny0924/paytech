# Data ID: channel-connector-service.yaml
# Namespace: 按环境选择；本地为 mor-local。Group: DEFAULT_GROUP。
# 本地参数模板；上传前按目标环境调整。数据库密码由进程环境 MOR_CHANNEL_CONNECTOR_DB_PASSWORD 提供。

server:
  address: 127.0.0.1
  port: 18110

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/mor_channel_connector?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: channel_connector_app
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000

channel-connector:
  # 能力代码目录（D06：能力代码只在 channel-connector 解析）；未注册代码失败关闭，修改需重启。
  capability-definitions:
    "[ACTION.PAY]": { value-type: BOOLEAN }
    "[ACTION.AUTHORIZE]": { value-type: BOOLEAN }
    "[ACTION.AUTHENTICATE]": { value-type: BOOLEAN }
    "[ACTION.CAPTURE]": { value-type: BOOLEAN }
    "[ACTION.VOID]": { value-type: BOOLEAN }
    "[ACTION.REFUND]": { value-type: BOOLEAN }
    "[AMOUNT.MIN]": { value-type: DECIMAL }
    "[AMOUNT.MAX]": { value-type: DECIMAL }
    "[SECURITY.3DS_MODE]": { value-type: CODE, allowed-codes: [REQUIRED, SUPPORTED, UNSUPPORTED] }
  # 渠道协议（2026-10-20 自 Platform ps.integration.* 迁入，键名后缀与默认值不变）；修改需重启。
  protocol:
    configuration:
      # 外部 API 配置写入共用一把资源锁（lock:external-api-config，TRY_LOCK）。
      lock-wait-time: 500ms
      lock-lease-time: 30s
    execution:
      # 出站地址只允许 https；读卡 card-service 无 context path。
      allowed-schemes: [https]
      card-context-path: ""
      # 两个执行舱的并发上限（支付渠道 / 服务渠道），拿不到许可不排队；修改需重启。
      payment-max-concurrency: 64
      service-max-concurrency: 16
      # 出站地址放行网段（CIDR）。默认空：拦截回环、私网、链路本地、保留与组播地址；
      # 本机与 mor-test 的渠道 Mock 若在私网，在部署配置中列出其网段，例如 [127.0.0.1/32] 或 Mock 容器子网。修改需重启。
      trusted-networks: []

vault:
  client:
    caller-service: channel-connector-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 5s
