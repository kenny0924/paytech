server:
  address: 127.0.0.1
  port: 0

spring:
  config:
    # 复用仓库已启动的本地环境凭据；唯一锚点 paytech.local-environment.dir 由父 POM 经 Surefire 注入（10 §4.4）。
    import:
      - "optional:file:${paytech.local-environment.dir}/.env.local[.properties]"
  application:
    name: channel-connector-service
  cloud:
    discovery:
      client:
        simple:
          instances:
            # 同一独立 Mock HTTP 服务承载 Vault 账号读取与 Platform 标准 API 执行。
            vault-service:
              - uri: "${test.mock-http.base-url}"
            platform-support-service:
              - uri: "${test.mock-http.base-url}"
    loadbalancer:
      retry:
        enabled: false
    nacos:
      config:
        enabled: false
      discovery:
        # 自动测试不连接 Nacos，外部服务由 simple discovery 指向测试 Mock HTTP 服务。
        enabled: false
        register-enabled: false
  datasource:
    url: "jdbc:mysql://127.0.0.1:13306/mor_channel_connector?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: channel_connector_app
    password: "${MOR_CHANNEL_CONNECTOR_DB_PASSWORD:local-channel-connector-change-me-2026}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: "SET time_zone = '+00:00'"
  # 仓库 local-environment 的本机 Redis：渠道成本写入口资源锁；凭据可用环境变量覆盖。
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: "${CHANNEL_CONNECTOR_TEST_REDIS_PASSWORD:${PAYTECH_REDIS_PASSWORD:${MOR_REDIS_PASSWORD:c4e99fe36176a66ece55b0c23e5af0be488d409f2e89f6c5}}}"
      connect-timeout: 2s
      timeout: 2s
  sql:
    init:
      mode: never
  jmx:
    enabled: false

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}] %kvp"

web:
  logging:
    metadata-only-path-prefixes:
      - /

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

# paytech-redis-starter
redis:
  # 测试专用 Key 前缀，与本地运行实例隔离；生产缺省使用 spring.application.name。
  key-prefix: channel-connector-mock
  coordination:
    enabled: true
    threads: 4
    netty-threads: 4

# paytech-compensation-event：本服务暂无补偿事件类型；引入组件只为带上 XXL-Job 执行器。
compensation:
  enabled: true
  # 多实例 Claim/Lease 的实例标识；测试固定值。
  instance-id: channel-connector-test

# paytech-xxl-job-starter（随 compensation-event 引入）：测试不连接调度中心，到期切换由用例直接调用 Job Handler。
xxl:
  job:
    executor:
      enabled: false

internal-auth:
  # 裸 OFF 会被 YAML 解析为布尔 false，必须带引号。
  mode: "OFF"

channel-connector:
  capability-definitions:
    "[ACTION.PAY]": { value-type: BOOLEAN }
    "[ACTION.AUTHORIZE]": { value-type: BOOLEAN }
    "[ACTION.AUTHENTICATE]": { value-type: BOOLEAN }
    "[ACTION.CAPTURE]": { value-type: BOOLEAN }
    "[ACTION.VOID]": { value-type: BOOLEAN }
    "[ACTION.REFUND]": { value-type: BOOLEAN }
    "[AMOUNT.MIN]": { value-type: DECIMAL }
    "[AMOUNT.MAX]": { value-type: DECIMAL }
    "[SECURITY.3DS_MODE]": { value-type: CODE, allowed-codes: [REQUIRED, SUPPORTED, UNSUPPORTED] }
  outbound:
    platform-context-path: "" # 测试 Mock HTTP 服务无 Platform 的 /platform-support 前缀。
    platform-read-timeout: 30s
  identifier:
    # Snowflake Region / Worker 标识（渠道成本主键与测试 Fixture 主键）；生产无默认值且必填，修改需重启。测试进程固定 31/29。
    region-id: 31
    worker-id: 29

vault:
  client:
    caller-service: channel-connector-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 5s

management:
  server:
    port: 0
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true

# test.mock-http.base-url 由 EnableMockHttpServer 在创建真实客户端之前注入随机 Loopback 端口。
