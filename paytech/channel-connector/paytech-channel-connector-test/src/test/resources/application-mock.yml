server:
  address: 127.0.0.1
  port: 0

spring:
  config:
    # 复用仓库已启动的本地环境凭据；唯一锚点 paytech.local-environment.dir 由父 POM 经 Surefire 注入（10 §4.4）。
    import:
      - "optional:file:${paytech.local-environment.dir}/.env.local[.properties]"
  application:
    name: channel-connector-service
  cloud:
    discovery:
      client:
        simple:
          instances:
            # 同一独立 Mock HTTP 服务承载 Vault（账号配置读取与 Protect）与 card-service 读卡正式合同；
            # 合成外部渠道也在同一服务的 /channel 前缀下，接入方出站地址由用例写入。
            vault-service:
              - uri: "${test.mock-http.base-url}"
            card-service:
              - uri: "${test.mock-http.base-url}"
    loadbalancer:
      retry:
        enabled: false
    nacos:
      config:
        enabled: false
      discovery:
        # 自动测试不连接 Nacos，外部服务由 simple discovery 指向测试 Mock HTTP 服务。
        enabled: false
        register-enabled: false
  datasource:
    url: "jdbc:mysql://127.0.0.1:13306/mor_channel_connector?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: channel_connector_app
    password: "${MOR_CHANNEL_CONNECTOR_DB_PASSWORD:local-channel-connector-change-me-2026}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: "SET time_zone = '+00:00'"
  # 仓库 local-environment 的本机 Redis：渠道配置、成本与外部 API 配置写入口资源锁；凭据可用环境变量覆盖。
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: "${CHANNEL_CONNECTOR_TEST_REDIS_PASSWORD:${PAYTECH_REDIS_PASSWORD:${MOR_REDIS_PASSWORD:c4e99fe36176a66ece55b0c23e5af0be488d409f2e89f6c5}}}"
      connect-timeout: 2s
      timeout: 2s
  sql:
    init:
      mode: never
  jmx:
    enabled: false

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}] %kvp"

web:
  logging:
    metadata-only-path-prefixes:
      - /

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

# paytech-redis-starter
redis:
  # 测试专用 Key 前缀，与本地运行实例隔离；生产缺省使用 spring.application.name。
  key-prefix: channel-connector-mock
  coordination:
    enabled: true
    threads: 4
    netty-threads: 4

# paytech-compensation-event：沙箱验证运行 INTEGRATION_VERIFY_RUN（2026-10-20 自 Platform 迁入）。
# 验证运行测试依赖真实执行器在提交后异步执行，因此保持启用；XXL 兜底扫描不启用，由用例有界等待任务结束。
compensation:
  enabled: true
  # 多实例 Claim/Lease 的实例标识；测试固定值。
  instance-id: channel-connector-test
  lease-duration: 2m
  scanner-batch-size: 100
  coordinator:
    core-size: 10
    maximum-size: 20
    queue-capacity: 80
    keep-alive: 60s
  handler:
    maximum-concurrency: 20

# paytech-xxl-job-starter（随 compensation-event 引入）：测试不连接调度中心，到期切换由用例直接调用 Job Handler。
xxl:
  job:
    executor:
      enabled: false

# 实例 ID（内部调用 Token 的 inst）：mode=OFF 时不使用；DUAL 读卡出站测试以独立上下文注入。
paytech:
  instance-id: ""

internal-auth:
  # 裸 OFF 会被 YAML 解析为布尔 false，必须带引号。共享 Mock 上下文为 OFF；DUAL 由独立上下文的动态属性覆盖并注入本地静态密钥对。
  mode: "OFF"

channel-connector:
  capability-definitions:
    "[ACTION.PAY]": { value-type: BOOLEAN }
    "[ACTION.AUTHORIZE]": { value-type: BOOLEAN }
    "[ACTION.AUTHENTICATE]": { value-type: BOOLEAN }
    "[ACTION.CAPTURE]": { value-type: BOOLEAN }
    "[ACTION.VOID]": { value-type: BOOLEAN }
    "[ACTION.REFUND]": { value-type: BOOLEAN }
    "[AMOUNT.MIN]": { value-type: DECIMAL }
    "[AMOUNT.MAX]": { value-type: DECIMAL }
    "[SECURITY.3DS_MODE]": { value-type: CODE, allowed-codes: [REQUIRED, SUPPORTED, UNSUPPORTED] }
  # 渠道协议（2026-10-20 自 Platform ps.integration.* 迁入）；修改需重启。
  protocol:
    configuration:
      lock-wait-time: 500ms # 外部 API 配置写入的 TRY_LOCK 等待；全模块共用 lock:external-api-config，默认 500ms。
      lock-lease-time: 30s # 资源锁租约，默认 30s；版本 CAS 仍为最终保护。
    execution:
      allowed-schemes: [https, http] # 默认只允许 https；只在本机 mock 加入 http，执行测试的出站地址指向本机 Mock 渠道。
      card-context-path: "" # 读卡请求地址 http://card-service{本值}/...；测试 Mock HTTP 服务承载 card 合同，card 本身也无 context path。
  identifier:
    # Snowflake Region / Worker 标识（渠道配置、成本、外部 API 配置主键与测试 Fixture 主键）；生产无默认值且必填，修改需重启。测试进程固定 31/29。
    region-id: 31
    worker-id: 29

vault:
  client:
    caller-service: channel-connector-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 5s

management:
  server:
    port: 0
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true

# test.mock-http.base-url 由 EnableMockHttpServer 在创建真实客户端之前注入随机 Loopback 端口。
