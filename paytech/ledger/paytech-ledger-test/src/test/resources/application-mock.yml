# ledger-service 配置字段清单，同时作为 Mock 测试的可运行配置。
# 只连接仓库 local-environment 的 Loopback MySQL/Redis/RabbitMQ；固定凭据为隔离本地测试账号，可用环境变量覆盖。

# ==================== 中间件、框架与公共组件配置 ====================

server:
  address: 127.0.0.1
  port: 0

spring:
  config:
    # 复用仓库已启动的本地 RabbitMQ 凭据；唯一锚点 paytech.local-environment.dir 由父 POM 经 Surefire 注入（10 §4.4）。
    import:
      - "optional:file:${paytech.local-environment.dir}/.env.local[.properties]"
  application:
    name: ledger-service
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  # 测试不建表、不执行任何 SQL 脚本（init/ddl.sql 由管理员手工执行）；同时屏蔽 reactor 构建中 paytech-messaging test-jar 的测试配置
  # （其 application-mock.yaml 会为自身测试启用 schema 脚本）。
  sql:
    init:
      mode: never
  datasource:
    url: "${LEDGER_TEST_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${LEDGER_TEST_DB_USERNAME:ledger_app}"
    password: "${LEDGER_TEST_DB_PASSWORD:05a148d75d6913440f13b66dd4f793519923433100eb1d0a}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: "${LEDGER_TEST_REDIS_PASSWORD:${PAYTECH_REDIS_PASSWORD:${MOR_REDIS_PASSWORD:c4e99fe36176a66ece55b0c23e5af0be488d409f2e89f6c5}}}"
      connect-timeout: 2s
      timeout: 2s
  # 仓库 local-environment 的本机 RabbitMQ；凭据只来自 .env.local 或同名环境变量。测试扮演 account 向 account.events 发布，需要发布确认。
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: "${MOR_RABBITMQ_USER}"
    password: "${MOR_RABBITMQ_PASSWORD}"
    virtual-host: "${MOR_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
  # account（过账进度、批次）与 billing（事实详情、pending）由 EnableMockHttpServer 的随机 Loopback 端口承载，真实客户端直连该地址。
  http:
    clients:
      imperative:
        factory: jdk
    serviceclient:
      account-service:
        base-url: "${ledger.test.external.base-url}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      billing-service:
        base-url: "${ledger.test.external.base-url}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

# paytech-redis-starter
redis:
  # 测试专用 Key 前缀，与本地运行实例隔离；生产缺省使用 spring.application.name。
  key-prefix: ledger-mock
  coordination:
    enabled: true
    threads: 4
    netty-threads: 4

# paytech-messaging 消费端：ledger.account.hash 与 ledger.account.p0..p3（AccountPosted 严格有序）；重投退避缩短到 200ms。
messaging:
  consumer:
    service: ledger
    retry-backoff: 200ms
  consumers:
    account:
      partitions: 4

management:
  server:
    # 独立管理端口；测试随机分配，由 @LocalManagementPort 读取。
    address: 127.0.0.1
    port: 0
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

# ==================== Ledger 系统自定义配置 ====================

ledger:
  identifier:
    # Snowflake Region / Worker 标识；生产无默认值且必填，修改需重启。测试进程固定 0/0。
    region-id: 0
    worker-id: 0
  test:
    external:
      # 测试专用运行时字段；EnableMockHttpServer 在创建真实客户端之前注入 Loopback 随机端口。
      base-url: ""
