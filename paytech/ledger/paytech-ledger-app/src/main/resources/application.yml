server:
  address: 127.0.0.1
  port: 18105

spring:
  application:
    name: ledger-service
  jmx:
    enabled: false
  datasource:
    url: "${LEDGER_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${LEDGER_DB_USERNAME:ledger_app}"
    password: "${LEDGER_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      host: "${LEDGER_REDIS_HOST:127.0.0.1}"
      port: "${LEDGER_REDIS_PORT:16379}"
      password: "${LEDGER_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s
  # AccountPosted 消费（技术方案 2.1）：ledger 只消费，不发布，因此不要求 Publisher Confirm。
  rabbitmq:
    host: "${LEDGER_RABBITMQ_HOST:127.0.0.1}"
    port: "${LEDGER_RABBITMQ_PORT:5672}"
    username: "${LEDGER_RABBITMQ_USERNAME:}"
    password: "${LEDGER_RABBITMQ_PASSWORD:}"
    virtual-host: "${LEDGER_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
  # 内部 HTTP 客户端：account 过账进度与批次（关账步骤 3、过账流追平），billing 经济事实与发布进度（AccountPosted 消费读事实、关账步骤 3）。
  # JDK HttpClient 不自动重试；Finance 后继服务不接服务发现，基址直接配置。
  http:
    clients:
      imperative:
        factory: jdk
    serviceclient:
      account-service:
        base-url: "${LEDGER_ACCOUNT_SERVICE_URL:http://127.0.0.1:18114}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      billing-service:
        base-url: "${LEDGER_BILLING_SERVICE_URL:http://127.0.0.1:18113}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

# paytech-redis-starter：人工调整复核、期间创建、试算与关账的资源锁使用 AbstractLockProcessor。
redis:
  coordination:
    enabled: true

# paytech-messaging 消费端：按 Handler 声明 ledger.account.hash 与分区队列 ledger.account.p0..p3（design/08 §3）；
# AccountPosted 按过账流严格有序（strictOrder），死信 ledger.account.dlq 的恢复路径是 POST /posting-streams/v1/catch-up。
messaging:
  consumer:
    service: ledger
  consumers:
    account:
      partitions: 4

management:
  server:
    # 管理端口 = 业务端口 + 1000（01 §3）。
    address: 127.0.0.1
    port: 19105
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

ledger:
  identifier:
    # 部署分配的 Snowflake Region / Worker 标识，必填；每个 app 独立分配。
    region-id: "${LEDGER_SNOWFLAKE_REGION_ID}"
    worker-id: "${LEDGER_SNOWFLAKE_WORKER_ID}"
