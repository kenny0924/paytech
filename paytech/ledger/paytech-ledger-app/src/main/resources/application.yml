server:
  address: 127.0.0.1
  port: 18105

spring:
  application:
    name: ledger-service
  jmx:
    enabled: false
  datasource:
    url: "${LEDGER_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${LEDGER_DB_USERNAME:ledger_app}"
    password: "${LEDGER_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      host: "${LEDGER_REDIS_HOST:127.0.0.1}"
      port: "${LEDGER_REDIS_PORT:16379}"
      password: "${LEDGER_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s
  # EconomicFactRecorded 消费（design/04 §5）：ledger 只消费，不发布，因此不要求 Publisher Confirm。
  rabbitmq:
    host: "${LEDGER_RABBITMQ_HOST:127.0.0.1}"
    port: "${LEDGER_RABBITMQ_PORT:5672}"
    username: "${LEDGER_RABBITMQ_USERNAME:}"
    password: "${LEDGER_RABBITMQ_PASSWORD:}"
    virtual-host: "${LEDGER_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
  # 关账步骤 2、3 的内部 HTTP 客户端（design/04 §6）：JDK HttpClient 不自动重试；Finance 后继服务不接服务发现，基址直接配置。
  http:
    clients:
      imperative:
        factory: jdk
    serviceclient:
      account-service:
        base-url: "${LEDGER_ACCOUNT_SERVICE_URL:http://127.0.0.1:18114}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      billing-service:
        base-url: "${LEDGER_BILLING_SERVICE_URL:http://127.0.0.1:18113}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

# paytech-redis-starter：人工调整复核、期间创建、试算与关账的资源锁使用 AbstractLockProcessor。
redis:
  coordination:
    enabled: true

# paytech-messaging 消费端：按 Handler 声明 ledger.billing.hash 与分区队列 ledger.billing.p0..p3（design/08 §3）。
messaging:
  consumer:
    service: ledger
  consumers:
    billing:
      partitions: 4

management:
  server:
    # 管理端口 = 业务端口 + 1000（01 §3）。
    address: 127.0.0.1
    port: 19105
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

ledger:
  identifier:
    # 部署分配的 Snowflake Region / Worker 标识，必填；每个 app 独立分配。
    region-id: "${LEDGER_SNOWFLAKE_REGION_ID}"
    worker-id: "${LEDGER_SNOWFLAKE_WORKER_ID}"
