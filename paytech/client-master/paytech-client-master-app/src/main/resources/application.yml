server:
  port: 18101

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
      initialization-fail-timeout: 1
      pool-name: client-master-database
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:public}"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - com.paytech.vault.client.autoconfigure.VaultClientAutoConfiguration
  application:
    name: client-master-service
  # 审核结果消费（cg_client_master_client_review）；仅在 onboarding 草稿与补偿开关开启时创建监听器。
  rabbitmq:
    host: "${CCT_RABBITMQ_HOST:127.0.0.1}"
    port: "${CCT_RABBITMQ_PORT:5672}"
    username: "${CCT_RABBITMQ_USERNAME:}"
    password: "${CCT_RABBITMQ_PASSWORD:}"
    virtual-host: "${CCT_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
  jmx:
    enabled: false

management:
  server:
    port: 19101
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    redis:
      enabled: ${onboarding.draft-enabled:false}
    rabbit:
      enabled: ${onboarding.draft-enabled:false}
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

onboarding:
  recovery-enabled: false
  draft-enabled: false
  # 由 CCT 维护的通用表单目录（2026-10-13 用户确认）：不按国家区分，签发国由客户从完整 ISO 国家中选择。修改后重启。
  form-catalog:
    organization-types:
      - { code: LIMITED_COMPANY, label: 有限公司 }
      - { code: PUBLIC_COMPANY, label: 上市公司 }
      - { code: PARTNERSHIP, label: 合伙企业 }
      - { code: SOLE_PROPRIETORSHIP, label: 个体经营 }
      - { code: NON_PROFIT, label: 非营利组织 }
      - { code: OTHER, label: 其他 }
    business-models:
      - { code: PHYSICAL_GOODS, label: 实物商品, client-types: [INDIVIDUAL, ORGANIZATION] }
      - { code: DIGITAL_GOODS, label: 数字商品, client-types: [INDIVIDUAL, ORGANIZATION] }
      - { code: SERVICES, label: 服务, client-types: [INDIVIDUAL, ORGANIZATION] }
      - { code: SUBSCRIPTION, label: 订阅, client-types: [INDIVIDUAL, ORGANIZATION] }
      - { code: MARKETPLACE, label: 平台 / 市场, client-types: [ORGANIZATION] }
      - { code: OTHER, label: 其他, client-types: [INDIVIDUAL, ORGANIZATION] }
    identifier-types:
      - { code: PASSPORT, label: 护照, client-types: [INDIVIDUAL], issuing-country-mode: REQUIRED }
      - { code: NATIONAL_ID, label: 身份证, client-types: [INDIVIDUAL], issuing-country-mode: REQUIRED }
      - { code: DRIVING_LICENSE, label: 驾照, client-types: [INDIVIDUAL], issuing-country-mode: REQUIRED }
      - { code: RESIDENCE_PERMIT, label: 居留证, client-types: [INDIVIDUAL], issuing-country-mode: REQUIRED }
      - { code: COMPANY_REGISTRATION_NUMBER, label: 公司注册号, client-types: [ORGANIZATION], issuing-country-mode: REQUIRED }
      - { code: TAX_ID, label: 税号, client-types: [ORGANIZATION], issuing-country-mode: REQUIRED }
      - { code: LEI, label: LEI, client-types: [ORGANIZATION], issuing-country-mode: NONE }
    # 运营审核选择的通用行业（2026-10-13 用户确认）；MCC 不建目录，由运营按卡组织标准填四位数字。
    industries:
      - { code: RETAIL, label: 零售 }
      - { code: DIGITAL_GOODS, label: 数字商品 }
      - { code: SOFTWARE_SAAS, label: 软件与 SaaS }
      - { code: PROFESSIONAL_SERVICES, label: 专业服务 }
      - { code: EDUCATION, label: 教育 }
      - { code: TRAVEL, label: 旅游 }
      - { code: FOOD_BEVERAGE, label: 餐饮 }
      - { code: MEDIA_ENTERTAINMENT, label: 媒体娱乐 }
      - { code: NON_PROFIT, label: 非营利 }
      - { code: OTHER, label: 其他 }
compensation:
  enabled: ${onboarding.recovery-enabled:false}

web:
  logging:
    metadata-only-path-prefixes:
      - /client-onboarding
      - /internal/client-onboarding
      # O02 申请资料读取返回申请人个人资料；分类命令记录操作者，只记元数据。
      - /client-onboarding-admin
      # 工作区摘要返回客户名称，只记元数据。
      - /client-workspace
redis:
  coordination:
    enabled: ${onboarding.draft-enabled:false}
    resource-lock:
      wait-time: 500ms
      lease-time: 30s
vault:
  client:
    connect-timeout: 2s
    read-timeout: 3s
# 内部调用 Token（D26）：默认关闭；值必须带引号，裸 OFF 在 YAML 1.1 中是布尔 false。
internal-auth:
  mode: "OFF"
