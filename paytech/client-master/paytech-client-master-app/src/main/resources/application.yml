server:
  port: 18101

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
      initialization-fail-timeout: 1
      pool-name: client-master-database
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:public}"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - com.paytech.vault.client.autoconfigure.VaultClientAutoConfiguration
  application:
    name: client-master-service
  # 审核结果消费（paytech-messaging 分区队列 client-master.compliance.p0..p3）；仅在 onboarding 草稿与补偿开关开启时注册 Handler。
  rabbitmq:
    host: "${CCT_RABBITMQ_HOST:127.0.0.1}"
    port: "${CCT_RABBITMQ_PORT:5672}"
    username: "${CCT_RABBITMQ_USERNAME:}"
    password: "${CCT_RABBITMQ_PASSWORD:}"
    virtual-host: "${CCT_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
  jmx:
    enabled: false

management:
  server:
    port: 19101
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          # 参考数据五类首次加载成功前不接流量（提交校验与分类保存依赖它）。
          include: readinessState,referenceData
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    redis:
      enabled: ${onboarding.draft-enabled:false}
    rabbit:
      enabled: ${onboarding.draft-enabled:false}
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

onboarding:
  recovery-enabled: false
  draft-enabled: false
# paytech-messaging 消费端（design/08 §3–§4）：订阅 compliance.events，声明 client-master.compliance.hash（x-consistent-hash）与
# client-master.compliance.p0..p3（Quorum、单活消费者、delivery-limit 5、DLX client-master.compliance.dlx → .dlq）；未注册 Handler
# （onboarding 开关关闭）时不声明订阅拓扑。分区数取默认 4（messaging.consumers.compliance.partitions 只能在注册了 Handler 时配置，
# 否则启动校验拒绝未订阅的发布方）；上线后修改分区数需先排空分区队列。
messaging:
  consumer:
    service: client-master

compensation:
  enabled: ${onboarding.recovery-enabled:false}

web:
  logging:
    metadata-only-path-prefixes:
      - /client-onboarding
      - /internal/client-onboarding
      # O02 申请资料读取返回申请人个人资料；分类命令记录操作者，只记元数据。
      - /client-onboarding-admin
      # 工作区摘要返回客户名称，只记元数据。
      - /client-workspace
      # 运营主档维护返回法定名称（个人 Client 为姓名），只记元数据。
      - /client-master-admin
redis:
  coordination:
    enabled: ${onboarding.draft-enabled:false}
    resource-lock:
      wait-time: 500ms
      lease-time: 30s
# 参考数据客户端（2026-10-27）：提交校验（国家、币种、行政区）与分类保存（行业、MCC）读进程内快照；启动后后台加载、每小时全量刷新，
# 首次成功前按 10 秒重试。不配 base-url：经服务发现访问 platform-support-service/platform-support，X-Caller-Service 取
# spring.application.name（client-master-service）。
platform-support:
  reference-data:
    client:
      kinds: [CURRENCY, COUNTRY, SUBDIVISION, INDUSTRY, MCC]

vault:
  client:
    connect-timeout: 2s
    read-timeout: 3s
# 内部调用 Token（D26）：默认关闭；值必须带引号，裸 OFF 在 YAML 1.1 中是布尔 false。
internal-auth:
  mode: "OFF"
