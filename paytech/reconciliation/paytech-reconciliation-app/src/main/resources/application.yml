server:
  address: 127.0.0.1
  port: 18115

spring:
  application:
    name: reconciliation-service
  jmx:
    enabled: false
  datasource:
    url: "${RECONCILIATION_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_reconciliation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${RECONCILIATION_DB_USERNAME:reconciliation_app}"
    password: "${RECONCILIATION_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

management:
  server:
    # 管理端口 = 业务端口 + 1000（01 §3）。
    address: 127.0.0.1
    port: 19115
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

reconciliation:
  identifier:
    # 部署分配的 Snowflake Region / Worker 标识，必填；每个 app 独立分配。
    region-id: "${RECONCILIATION_SNOWFLAKE_REGION_ID}"
    worker-id: "${RECONCILIATION_SNOWFLAKE_WORKER_ID}"
