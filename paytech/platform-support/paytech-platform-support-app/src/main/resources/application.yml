server:
  port: 18106
  servlet:
    context-path: /platform-support

spring:
  application:
    name: platform-support-service
  # RabbitMQ：工作流业务回调（WorkflowCallbackRaised）的发布端；凭据只经环境变量注入，不写入版本库。
  # 连接在首次发布时建立；Broker 不可用时回调由补偿任务重试，达到 workflow.callback-max-attempts 后置 FAILED 待人工重试。
  rabbitmq:
    host: "${PLATFORM_SUPPORT_RABBITMQ_HOST:127.0.0.1}"
    port: "${PLATFORM_SUPPORT_RABBITMQ_PORT:5672}"
    username: "${PLATFORM_SUPPORT_RABBITMQ_USERNAME:}"
    password: "${PLATFORM_SUPPORT_RABBITMQ_PASSWORD:}"
    virtual-host: "${PLATFORM_SUPPORT_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: "${PLATFORM_SUPPORT_REDIS_HOST:127.0.0.1}"
      port: "${PLATFORM_SUPPORT_REDIS_PORT:16379}"
      password: "${PLATFORM_SUPPORT_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: "${PLATFORM_SUPPORT_DB_URL}"
    username: "${PLATFORM_SUPPORT_DB_USERNAME}"
    password: "${PLATFORM_SUPPORT_DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        connectTimeout: 2000
        socketTimeout: 2000
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:mor-local}"
  jmx:
    enabled: false

# 实例 ID（实例清单 instance.id，01 §5）：内部调用 Token 的 inst；internal-auth.mode 非 OFF 或签发端启用时必填。
paytech:
  instance-id: "${PAYTECH_INSTANCE_ID:}"

vault:
  client:
    caller-service: platform-support-service
    connect-timeout: 2s
    read-timeout: 2s

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,gatewaySnapshot
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    redis:
      enabled: "${operations.authentication.enabled:false}"
    # RabbitMQ 只承载工作流回调的异步发布，失败由补偿任务重试，不纳入健康状态。
    rabbit:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Authentication adapters are explicitly development-only; enabling them requires local/auto.
operations:
  audit:
    queue-capacity: 256
  authentication:
    lock-wait-time: 500ms
    lock-lease-time: 30s
    enabled: false

redis:
  coordination:
    enabled: "${operations.authentication.enabled:false}"
    resource-lock:
      wait-time: 500ms
      lease-time: 30s

web:
  logging:
    metadata-only-path-prefixes:
      - /internal/files
      - /storage-admin
      - /notifications
      - /authentication
      - /authorization
      - /operations
      - /gateway-admin
      - /console-admin
      - /permission-admin
      - /api-credential-admin
      - /client-api-credentials
      - /client-webhooks
      - /client-team
      - /client-invitations
      - /api-scope-admin
      - /api-credentials
      - /tenant-projections
      - /notification-admin
      - /webhook-admin
      - /workflow-admin
      - /workflow
      - /platform/v1/internal-tokens
      - /data-query-admin/v1/data-sources
      - /data-query-admin/v1/data-source-connection-tests
      - /data-query-admin/v1/template-trials
      - /data-query/v1


client:
  authentication:
    lock-wait-time: 500ms
    lock-lease-time: 30s
    enabled: false

tenant:
  projection:
    enabled: false

# 本地补偿执行默认跟随文件开关（PLATFORM_SUPPORT_FILES_ENABLED），未设置时跟随 Operations 人工认证（工作流通知与回调）；
# 单独启用通知等其他消费者时设置 PLATFORM_SUPPORT_COMPENSATION_ENABLED=true。按环境变量串联，因为 files.enabled 在本文件中总有值。
# 关闭时不创建补偿 Registrar：通知启用会在启动时因缺少该 Bean 失败，工作流登记通知回调的写操作会失败回滚。
# 周期扫描的 XXL-Job 调度另行配置（工作流两类任务 WORKFLOW_NOTIFICATION、WORKFLOW_CALLBACK_EVENT 与其他补偿任务共用同一扫描任务）。
compensation:
  enabled: ${PLATFORM_SUPPORT_COMPENSATION_ENABLED:${PLATFORM_SUPPORT_FILES_ENABLED:${operations.authentication.enabled:false}}}

# 文件能力：存储实例、存储桶、写入路由与密钥在运营「存储管理」中维护（t_file_storage_*，密钥只存 Vault），不在配置文件中。
# files.enabled 控制内部文件接口（/internal/files/v1）、FILE_SCAN 扫描任务、格式检查器与存储快照刷新；启用需 Redis 协调与本地补偿执行器。
# 旧键 files.onboarding.storage-provider、storage-container-ref、scan-policy-code、upload-seconds、minio.*、s3.* 已删除，
# 残留时启动失败。入驻文件入口（files.onboarding.enabled）已删除：上传、下载经 BFF 调内部文件接口，业务只保存文件地址。
# 存储密钥需要 Vault 规则：platform-support-service / PROTECT / FILE_STORAGE_CREDENTIAL_V1 / FILE_STORAGE_SETUP 与
# REVEAL / FILE_STORAGE_CREDENTIAL_V1 / FILE_STORAGE_ACCESS。
files:
  enabled: ${PLATFORM_SUPPORT_FILES_ENABLED:false}
  storage:
    # 进程内存储快照的刷新间隔；本进程的管理写入提交后立即刷新。
    snapshot-refresh: 30s
    # 存储管理写入的资源锁（实例与其存储桶按实例代码、路由按来源系统）；修改需重启。
    lock-wait-time: 500ms
    lock-lease-time: 30s

# 币种规则维护按币种代码加锁（currency-spec:{currency}），新建、修改与启停共用；修改需重启。
ps:
  reference-data:
    currency-spec:
      lock-wait-time: 500ms
      lock-lease-time: 30s

# Scope create/update share the Foundation Processor lock; timing changes require restart.
api-scope:
  management:
    lock-wait-time: 500ms
    lock-lease-time: 30s

# 普通邮件：模块入口与内部 HTTP（POST /notifications/v1/requests）；启用时显式开启 compensation.enabled 并配置实际 Provider/Vault。
# Client 认证邮件经同一模块即时发送（SendTransientEmailProcessor），开启 client.authentication.enabled 时必须开启本模块。
notification:
  enabled: false
  # worker-id: 独立启用通知时必须显式分配 0..31，不提供生产默认值。
  maximum-send-attempts: 3
  retry-delay: 30s
  # 仅不支持查询的 Provider（如 SES）：结果未知后至少等待该时长才重发，至少 1m。
  unknown-resend-delay: 10m
  # Operations 通知管理写入的资源锁（模板、语言内容、路由按模板编码，账号按账号编码）；不依赖 notification.enabled。
  management:
    lock-wait-time: 500ms
    lock-lease-time: 30s
  # 只能即时发送的模板（认证链接，不落库、不重试）；普通通知与 HTTP 白名单不能使用。
  transient-template-codes:
    - CLIENT_EMAIL_VERIFICATION
    - CLIENT_PASSWORD_RESET
    - CLIENT_TENANT_INVITATION
  # Amazon SES 适配器（类型 AMAZON_SES）；需同时启用 notification.enabled，并配置 VaultClient。
  # 账号的区域、发件地址、Configuration Set 与密钥在运营后台维护（t_notification_provider，密钥存 Vault），这里只有环境级参数。
  ses:
    enabled: ${NOTIFICATION_SES_ENABLED:false}
    # endpoint: 可选 HTTPS 终端覆盖（如 VPC 终端），对全部账号生效，默认使用账号区域的终端。
    connect-timeout: 2s
    read-timeout: 5s
    # 投递事件（送达 / 退信 / 投诉）：SES Configuration Set → SNS → SQS，各实例定时拉取账号上配置的事件队列。
    # 访问队列复用账号的发送密钥（IAM 需 sqs:ReceiveMessage、sqs:DeleteMessage）；默认关闭。
    events:
      enabled: ${NOTIFICATION_SES_EVENTS_ENABLED:false}
      poll-interval: 60s
      wait-time: 10s
      max-batches: 5
      visibility-timeout: 60s
      # endpoint: 可选 SQS 终端覆盖，默认使用队列 URL 所在区域的终端。
      connect-timeout: 2s
      read-timeout: 15s
  # 内部 HTTP 调用方白名单：服务名 → 可用普通邮件模板编码。过渡信任，X-Caller-Service 可伪造，部署须限制私网访问。
  # 默认为空，全部拒绝；例如 payment-service: [PAYMENT_REFUND_SUCCEEDED_EMAIL]
  http:
    callers: {}

# Client Webhook 投递：内部 HTTP 受理（POST /webhooks/v1/events）、补偿投递与 Operations 管理（/webhook-admin/v1）。
# 启用时须同时开启 compensation.enabled，并在 Vault 登记 WEBHOOK_SIGNING_SECRET_V1 与 WEBHOOK_SIGNING 用途的 Protect/Reveal 规则。
webhook:
  enabled: false
  # worker-id: 通知与人工认证都关闭时必须显式分配 0..31，不提供生产默认值。
  maximum-attempts: 10
  connect-timeout: 5s
  response-timeout: 10s
  # 轮换时旧密钥继续参与签名的时长；“立即作废”不受此影响。
  secret-grace-period: 1h
  maximum-endpoints-per-client: 5
  # 生产只允许 https，且不放行任何内网网段；不要在生产配置中修改这两项。
  allowed-schemes: [https]
  trusted-networks: []
  management-lock-wait-time: 500ms
  management-lock-lease-time: 30s
  # 内部 HTTP 调用方白名单：服务名 → 可提交的事件类型。过渡信任，X-Caller-Service 可伪造，部署须限制私网访问。
  # 默认为空，全部拒绝；例如 acquiring-service: [order.paid, refund.succeeded]（第 03 步由 commerce-service 改名）
  http:
    callers: {}

# 数据查询（paytech-platform-support-data-query）：Operations 数据源 / 模板维护（/data-query-admin/v1）与执行（/data-query/v1）。
# 依赖 operations.authentication.enabled=true；需先手工执行 docs/database/sql/changes/2026-10-22-data-query.sql，
# 并在 Vault 登记 DATA_SOURCE_PASSWORD_V1 的 PROTECT（DATA_SOURCE_CONFIGURATION）与 REVEAL（DATA_SOURCE_CONNECTION）规则。
data-query:
  # 系统硬上限：模板约束与请求都不能超过；修改需重启。
  limits:
    max-rows: 10000
    max-timeout: 8s # 低于 BFF 9s 与 Gateway 10s 响应超时
    max-offset: 100000
    max-response-bytes: 10MB
    max-pool-size: 10
    max-list-size: 1000
    max-body-length: 48KB # Gateway Body 上限 65536 字节内留出其余字段
    max-validation-combinations: 256
  datasource:
    refresh-enabled: true # 定时比较数据源版本并重建 / 退役连接池；关闭后只有修改所在实例在提交后刷新。
    refresh-interval: 5s
  management:
    lock-wait-time: 500ms # lock:data-query:source:{id} / lock:data-query:template:{id} 的 TRY_LOCK 等待。
    lock-lease-time: 60s # 覆盖锁内 Vault 调用、连接检查与本地事务。
  # 执行接口调用方白名单（过渡信任：X-Caller-Service 可伪造，部署须限制私网访问）；默认为空，全部拒绝。
  # 各环境配置：[operations-console-bff]
  http:
    callers: []

# 内部调用身份（D26，Foundation paytech-internal-auth）：默认 OFF，不校验入站、不附加出站 Token；DUAL 接受 Token 并回退 X-Caller-Service。
internal-auth:
  mode: "${PLATFORM_SUPPORT_INTERNAL_AUTH_MODE:OFF}"
  # 申请 Token 的调用方尚无 Token，签发与 JWKS 在 REQUIRED 下仍须豁免；其余路径按模式校验。
  exempt-path-prefixes:
    - /actuator
    - /public/
    - /platform/v1/internal-tokens
    - /platform/v1/internal-auth/jwks
  # Token 校验公钥来源：签发端启用（internal-token.issuer.enabled=true）时用本地密钥集合，此键不生效；未启用签发端时按此地址
  # 惰性拉取 JWKS，默认指向本服务自己的 JWKS 端点（签发端关闭时不存在）。DUAL 下调用方只带 X-Caller-Service、不带 Token，不会拉取；
  # 带 Token 而公钥不可用时 DUAL 回退 X-Caller-Service，REQUIRED 返回 503。切换 REQUIRED 前须启用签发端或配置真实 JWKS 地址。
  # mode 非 OFF 时还需要 PAYTECH_INSTANCE_ID（paytech.instance-id，Token inst 校验）。
  jwks-uri: "${PLATFORM_SUPPORT_INTERNAL_AUTH_JWKS_URI:http://127.0.0.1:${server.port}${server.servlet.context-path}/platform/v1/internal-auth/jwks}"

# 内部调用 Token 签发端（D26）：POST /platform/v1/internal-tokens 与 GET /platform/v1/internal-auth/jwks；默认关闭。
# 启用时须同时启用 operations 或 client 人工认证（签发与拒绝写入审计），并通过安全配置注入签名私钥。
internal-token:
  issuer:
    enabled: false
    # STATIC：配置注入的 P-256 私钥，prod Profile 禁止；t_jwt_signing_key 的 INTERNAL 用途待 Schema 变更。
    key-usage: STATIC
    instance-id: "${paytech.instance-id}"
    token-lifetime: 300s
    # private-jwk: 含 kid 的 P-256 私钥 JWK JSON，仅经安全配置注入，不得写入版本库。
    # 轮换：新私钥生效后把旧公钥放入此列表，至少保留 300s + 调用方 JWKS 缓存 5min。
    retiring-public-jwks: []
    # 调用方白名单：服务名 → targets（目标服务名）与 purposes（Purpose Code）；默认为空，全部拒绝。
    # 例如 payment-service: {targets: [vault-service], purposes: [GENERAL]}
    callers: {}

# 工作流（paytech-platform-support-workflow）：写入口资源锁 workflow-instance:{id}、workflow-definition:{id}、
# workflow-action-template:{id}（TRY_LOCK）；通知与回调最多尝试 5 次后置 FAILED，可人工重试。修改需重启。
workflow:
  lock-wait-time: 500ms
  lock-lease-time: 30s
  callback-max-attempts: 5
  notification-template-code: WORKFLOW_NOTIFICATION # Delivery 普通模板，由注册 DML 登记。
  event-source-service: platform-support
  event-instance-id: "${PAYTECH_INSTANCE_ID:main}"
  data-query: # DATA_QUERY 系统检查（REQ-05）；重查间隔由 XXL 任务 workflowDataQueryRecheck 的 CRON 决定。
    timeout: 5s # 单次查询超时上限，1–8 秒整秒；实际取 min(模板 timeoutSeconds, 本值, data-query.limits.max-timeout)。
    check-lock-lease: 30s # 检查锁 workflow-action-check:{actionRunId} 租约，不小于 timeout + 10s。
    recheck-batch-size: 100 # 每分片每轮最多检查数，1–1000。
    recheck-min-age: 4m # 最近检查早于此值的动作才进入本轮。
    recheck-round-budget: 240s # 每轮耗时上限，超过即停。

# 多语言（paytech-platform-support-localization）：Operations 维护 /internal/localization/v1，manifest 匿名读取。
# 需先手工执行 docs/database/sql/changes/2026-10-23-localization.sql 与注册块 135；语言包经 Platform 文件入口以 platform-support × PUBLIC
# 写入路由上传到公开桶（原因码 I18N_RELEASE_BUNDLE，检查策略 I18N_BUNDLE_JSON），files.enabled 关闭时发布与 manifest 返回 503。
# 资源锁 localization:application:{编码}、localization:locale:{代码}。
localization:
  lock-wait-time: 500ms # TRY_LOCK 等待，超时返回 409。
  lock-lease-time: 120s # 发布在锁内生成并上传语言包；版本与修订号 CAS 仍为最终保护。
  import-max-file-bytes: 2097152 # key 导入与翻译导入文件上限（2 MiB），与上传原因码的大小上限一致。

# Foundation paytech-messaging 发布端：声明 platform-support.events（Durable Fanout）并提供 DomainEventPublisher，
# 只发布工作流业务回调 WorkflowCallbackRaised（事件目录 catalog/events.yaml）。目前没有订阅方，不可路由按 ACK_AND_WARN
# 视为发布成功并告警；有订阅方后改为 FAIL。Platform 不消费事件，不设置 consumer.service。
messaging:
  enabled: true
  producer:
    service: platform-support
  publisher:
    unroutable-policy: ACK_AND_WARN
