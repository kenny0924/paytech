server:
  address: 127.0.0.1
  port: 0
  servlet:
    context-path: /platform-support

spring:
  application:
    name: platform-support-service
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/mor_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: platform_app
    # MockTestBase 自动提供 .env.local 的 MOR_PLATFORM_DB_PASSWORD，无需配置启动环境变量。
    password: "${PLATFORM_SUPPORT_TEST_DB_PASSWORD:${MOR_PLATFORM_DB_PASSWORD:local-platform-change-me-2026}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      initialization-fail-timeout: -1
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        connectTimeout: 2000
        socketTimeout: 5000
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      # .env.local 中仓库 Redis 密码名为 MOR_REDIS_PASSWORD；PAYTECH_REDIS_PASSWORD 为 compose 启动变量。
      password: "${PLATFORM_SUPPORT_TEST_REDIS_PASSWORD:${MOR_REDIS_PASSWORD:${PAYTECH_REDIS_PASSWORD:local-redis-change-me-2026}}}"
      database: 0
      connect-timeout: 2s
      timeout: 2s
  cloud:
    discovery:
      enabled: true
      client:
        simple:
          instances:
            # 同一独立 Mock HTTP 服务承载 Vault 与 CCT 正式合同，地址由 EnableMockHttpServer 运行时注入。
            vault-service:
              - uri: "${test.mock-http.base-url}"
            client-master-service:
              - uri: "${test.mock-http.base-url}"
            payment-service:
              - uri: "${test.mock-http.base-url}"
    nacos:
      discovery:
        enabled: false
        register-enabled: false
        server-addr: 127.0.0.1:8848
        namespace: mor-local
  http:
    clients:
      imperative:
        factory: jdk
      connect-timeout: 2s
      read-timeout: 5s
      redirects: dont-follow

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,gatewaySnapshot
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

redis:
  key-prefix: platform-support:mock
  coordination:
    enabled: true # 认证、管理写接口、租户投影与文件的资源锁均依赖 Redis 协调。
    threads: 4
    netty-threads: 4
    connection-minimum-idle-size: 1
    connection-pool-size: 16
    subscription-connection-minimum-idle-size: 1
    subscription-connection-pool-size: 8
    resource-lock:
      wait-time: 500ms
      lease-time: 30s

vault:
  client:
    caller-service: platform-support-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 2s
    # base-url: 仅 test/unittest 直连时配置，必须与 service-id 互斥；空字符串也会启用直连。

compensation:
  enabled: true
  instance-id: platform-support-mock
  lease-duration: 2m
  scanner-batch-size: 100
  coordinator:
    core-size: 10
    maximum-size: 20
    queue-capacity: 80
    keep-alive: 60s
  handler:
    maximum-concurrency: 20

xxl:
  job:
    admin:
      addresses: ""
      access-token: ""
      timeout: 3
    executor:
      enabled: false
      app-name: platform-support-service
      address: ""
      ip: 127.0.0.1
      port: 0
      log-path: ./target/xxl-job
      log-retention-days: 30
      excluded-packages: org.springframework.,spring.

# 实例 ID：签发 Token 的 inst 与本服务入站校验的期望值。
paytech:
  instance-id: main

# 内部调用身份（Foundation paytech-internal-auth）：共享 Mock 上下文为 OFF；DUAL / REQUIRED 由独立上下文的测试属性覆盖。
internal-auth:
  mode: "OFF" # 必须加引号：YAML 1.1 把裸 OFF 解析为布尔 false，Foundation 会把它当作非 OFF 模式。
  exempt-path-prefixes:
    - /actuator
    - /public/
    - /platform/v1/internal-tokens
    - /platform/v1/internal-auth/jwks
  # jwks-uri: 签发端启用时以本地密钥集合校验，不配置。
  # jwks-cache-ttl / jwks-timeout / jwks-forced-refresh-interval：只在使用 jwks-uri 时生效，沿用默认 5min / 2s / 10s。
  # static-key.private-jwk / static-key.public-jwk：不配置；Platform 自身作为签发端，不使用 Foundation 本地静态密钥。

# Foundation paytech-messaging：只装配编解码与事件目录；未设置 producer/consumer.service，不连接 Broker、不声明队列。
messaging:
  enabled: true
  # producer.service / producer.confirm-timeout（默认 10s）、consumer.service / consumer.retry-backoff（默认 1s）、
  # consumers.<producer>.partitions（默认 4）：发布与消费在 D07 后续切片启用，本步不设置。

web:
  logging:
    metadata-only-path-prefixes:
      - /internal/onboarding-files
      - /internal/files
      - /storage-admin
      - /onboarding-files
      - /review-files
      - /authentication
      - /authorization
      - /operations
      - /gateway-admin
      - /console-admin
      - /permission-admin
      - /api-credential-admin
      - /client-api-credentials
      - /client-webhooks
      - /client-team
      - /client-invitations
      - /api-scope-admin
      - /api-credentials
      - /tenant-projections
      - /notification-admin
      - /webhook-admin
      - /platform/v1/internal-tokens
      - /data-query-admin/v1/data-sources
      - /data-query-admin/v1/data-source-connection-tests
      - /data-query-admin/v1/template-trials
      - /data-query/v1

# 人工认证、管理接口与租户投影在 Mock 中全部启用；本地密钥为仓库隔离的合成测试值。
operations:
  authentication:
    enabled: true
    worker-id: 30 # Snowflake Worker；启用人工认证时由通知、Client 认证与租户投影共用。
    lock-wait-time: 500ms
    lock-lease-time: 30s
  audit:
    queue-capacity: 256 # 异步审计队列容量。
    # 以下为当前代码的只读预算，列出用于配置清单，不表示可运行时覆盖。
    worker-count: 1
    maximum-pool-size: 1
    minimum-idle: 0
    max-event-bytes: 65536
    max-attributes: 256
    max-attribute-bytes: 4096
    max-attribute-code-points: 1000
    connection-timeout-millis: 1000
    validation-timeout-millis: 500
    connect-timeout-millis: 1000
    lock-wait-timeout-seconds: 1
    statement-timeout-seconds: 2
    transaction-timeout-seconds: 3
    socket-timeout-millis: 3000
    shutdown-timeout-millis: 5000
client:
  authentication:
    enabled: true
    issuer: https://client.example.test # 合成 issuer。
    worker-id: 29 # 仅 Operations 认证关闭时创建 Client 专用 Snowflake；Mock 中共用 Operations 生成器。
    public-origin: https://client.example.test # 邮件链接站点。
    lock-wait-time: 500ms
    lock-lease-time: 30s
tenant:
  projection:
    enabled: true # CCT 来源投影写入口；依赖人工认证与 Redis 协调。
files:
  # 共享 Mock 上下文关闭文件能力；文件测试由 OnboardingFileTestBase 在独立上下文开启 files.enabled 与 files.onboarding.enabled。
  enabled: false # 内部文件接口、FILE_SCAN、格式检查器与存储快照刷新。
  onboarding:
    enabled: false # Client 入驻上传；要求 files.enabled=true。
    cct-test-base-url: "" # 既有受限直连字段；此处禁用，不连接外部系统。
  # 存储实例、存储桶与写入路由在 t_file_storage_* 中维护，测试由 StorageInstanceMocker 插入，不在此配置。
  storage:
    snapshot-refresh: 1h # 生产默认 30s；测试由 Mocker 与管理写入显式刷新，避免定时刷新与用例交错。
    lock-wait-time: 500ms # 存储管理写入的 TRY_LOCK 等待。
    lock-lease-time: 30s # 存储管理写入的资源锁租约。
# 测试专用：仓库 local-environment 的 MinIO（profile storage），只供测试侧夹具与 Vault 凭据 DTO 使用，生产不读取。
# 凭据优先取环境变量，否则由 LocalMockEnvironmentInitializer 读取 .env.local；证书目录取 paytech.local-environment.dir。
test:
  storage:
    endpoint: https://127.0.0.1:19400
    region: us-east-1
    bucket: mor-platform-files-test # 版本化、SSE-S3 加密的测试专用存储桶。
    access-key: "${MOR_MINIO_PLATFORM_ACCESS_KEY:}" # 只授权两个 Platform 存储桶的账号。
    secret-key: "${MOR_MINIO_PLATFORM_SECRET_KEY:}"
    root-user: "${MOR_MINIO_ROOT_USER:}" # 仅用于在测试中临时创建与删除检查用存储桶。
    root-password: "${MOR_MINIO_ROOT_PASSWORD:}"
    trusted-certificate: "${paytech.local-environment.dir}/minio/certs/public.crt" # 本机自签名证书。
  # 被查库连接参数：仓库隔离的本地测试账号，密码优先取环境变量，其次 local-environment/.env.local，最后为 .env.example 的默认值。
  data-query:
    fixture:
      host: 127.0.0.1
      port: 13306
      reader-username: data_query_fixture_reader
      reader-password: "${MOR_DATA_QUERY_FIXTURE_READER_PASSWORD:local-data-query-fixture-reader-change-me-2026}"
      writer-username: data_query_fixture_writer
      writer-password: "${MOR_DATA_QUERY_FIXTURE_WRITER_PASSWORD:local-data-query-fixture-writer-change-me-2026}"
ps:
  access-control:
    lock-wait-time: 500ms # Scope 管理写接口锁预算。
    lock-lease-time: 30s
    tenant-access:
      lock-wait-time: 500ms
      lock-lease-time: 30s
    permission:
      lock-wait-time: 500ms
      lock-lease-time: 30s
    console-resource:
      lock-wait-time: 500ms
      lock-lease-time: 30s
  reference-data:
    currency-spec:
      lock-wait-time: 500ms # 币种规则维护的 TRY_LOCK 等待；新建、修改与启停共用 currency-spec:{currency}。
      lock-lease-time: 30s # 资源锁租约；版本 CAS 与币种唯一索引仍为最终保护。
# 保留正式 application.yml 的旧键清单；当前 Properties 消费 ps.access-control。
api-scope:
  management:
    lock-wait-time: 500ms
    lock-lease-time: 30s

# 通知模块仅在本测试配置启用；Provider 只在 src/test 中按场景配置。
notification:
  enabled: true
  worker-id: 31 # 仅本地通知测试；人工认证启用时共享认证生成器。
  maximum-send-attempts: 3
  retry-delay: 30s
  # 不支持查询的 Provider 结果未知后的安全重发窗口；测试通过前移尝试开始时间越过窗口，不改时钟。
  unknown-resend-delay: 10m
  # Operations 通知管理写入的资源锁（模板、语言内容、路由按模板编码，账号按账号编码）；不依赖 notification.enabled。
  management:
    lock-wait-time: 500ms
    lock-lease-time: 30s
  # 认证即时发送模板，与 NotificationTestMapper.authenticationTemplates 一致。
  transient-template-codes:
    - CLIENT_EMAIL_VERIFICATION
    - CLIENT_PASSWORD_RESET
    - CLIENT_TENANT_INVITATION
  # SES 适配器指向独立 Mock HTTP 服务的 /ses 前缀（SesMockController），真实 SDK 客户端与 SigV4 签名不变。
  # 账号的区域、发件地址与合成密钥 Token 由 NotificationTestMapper.sesProvider 写入账号表；路由默认仍指向 Mock Provider。
  ses:
    enabled: true
    endpoint: "${test.mock-http.base-url}/ses" # 运行时由 EnableMockHttpServer 注入，对全部账号生效；生产为空走区域终端。
    connect-timeout: 1s
    read-timeout: 1s # 生产默认 5s；测试用最小值缩短超时用例。
    # 投递事件拉取指向 Mock HTTP 服务的 /sqs 前缀（SqsMockController）；用例经 NotificationEventPollJob.poll 触发，
    # 间隔取上限避免后台调度在用例期间自行拉取，长轮询为 0 秒。
    events:
      enabled: true
      endpoint: "${test.mock-http.base-url}/sqs"
      poll-interval: 1h
      wait-time: 0s
      max-batches: 2
      visibility-timeout: 30s
      connect-timeout: 1s
      read-timeout: 2s
  # 内部 HTTP 白名单：两个测试调用方共用测试模板（NotificationRequestBuilder 常量），TestMapper 按 notification-test 前缀清理。
  http:
    callers:
      notification-test: [NOTIFICATION_TEST]
      notification-test-peer: [NOTIFICATION_TEST]

# Client Webhook：仅本测试配置启用；接收端是独立 Mock HTTP 服务的 /webhook-receiver/{name}（WebhookReceiverMockController）。
webhook:
  enabled: true
  maximum-attempts: 3 # 生产默认 10；测试用 3 次即可覆盖 DEAD。
  connect-timeout: 1s
  response-timeout: 1s # 生产默认 10s；测试用最小值缩短超时用例。
  secret-grace-period: 1h
  maximum-endpoints-per-client: 5
  # 只在本机 mock 放行 http 与回环地址，接收端指向本机 Mock 服务；生产配置不得设置。
  allowed-schemes: [https, http]
  trusted-networks: [127.0.0.1/32]
  management-lock-wait-time: 500ms
  management-lock-lease-time: 30s
  # 内部 HTTP 白名单：两个测试调用方，WebhookFixture 的常量与此一致。
  http:
    callers:
      webhook-test: [order.paid, order.cancelled, refund.succeeded]
      webhook-test-peer: [order.paid]

# 数据查询：被查库为本地 MySQL 的 mor_data_query_fixture（Q12，人工执行 local-environment/mysql/manual/2026-10-22-data-query-fixture.sql）。
data-query:
  limits: # 与正式默认值相同；超时与结果过大用例按这些上限构造查询。
    max-rows: 10000
    max-timeout: 8s # 低于 BFF 9s 与 Gateway 10s 响应超时
    max-offset: 100000
    max-response-bytes: 10MB
    max-pool-size: 10
    max-list-size: 1000
    max-body-length: 48KB # Gateway Body 上限 65536 字节内留出其余字段
    max-validation-combinations: 256
  datasource:
    refresh-enabled: false # 关闭定时刷新：用例经提交后的本地刷新与显式 refresh() 驱动，避免后台任务与每例清理交错。
    refresh-interval: 5s
  management:
    lock-wait-time: 500ms
    lock-lease-time: 60s
  http:
    callers: [operations-console-bff] # DataQueryApiTestBase.CALLER；其他调用方用于拒绝用例。

# 内部调用 Token 签发端：Mock 中启用；密钥为仓库隔离的合成 P-256 测试值，不对应任何真实环境。
internal-token:
  issuer:
    enabled: true
    key-usage: STATIC
    instance-id: "${paytech.instance-id}"
    token-lifetime: 300s
    private-jwk: '{"kty":"EC","crv":"P-256","kid":"platform-internal-test-1","x":"6NhqoPCrHokc5Sn4qc4fCPDWgAKbCb5hP_7pRsdrmBE","y":"80aoxJNXwf-euYLO66yr_eg2S_6TSy0B05DScIU9pzY","d":"ByslDI82RfrL6N3V10EVcNhy4OSrZdRSL4JZJD-zg-g"}'
    # 轮换中的旧公钥：只用于验签，JWKS 中排在签名公钥之后。
    retiring-public-jwks:
      - '{"kty":"EC","crv":"P-256","kid":"platform-internal-test-0","x":"6-ZjQy1muJr_ZE51ZJYDM6vZeS3XBRHLgKwDZ4qFWjs","y":"TrlSXfD22Pb_OqTIAu_P0a1cAQWiHXH8FYBpAnmEwI8"}'
    # 调用方白名单：签发测试调用方；Webhook / Notification 测试调用方为访问 Platform 自身申请 Token；Platform 自身出站。
    callers:
      issuer-test:
        targets: [payment-service, client-master-service, card-service]
        purposes: [GENERAL, CARD_READ]
      webhook-test:
        targets: [platform-support-service]
        purposes: [GENERAL]
      webhook-test-peer:
        targets: [platform-support-service]
        purposes: [GENERAL]
      notification-test:
        targets: [platform-support-service]
        purposes: [GENERAL]
      # 内部文件接口测试调用方（StorageInstanceMocker 常量）。
      file-test:
        targets: [platform-support-service]
        purposes: [GENERAL]
      file-test-peer:
        targets: [platform-support-service]
        purposes: [GENERAL]
      # Platform 自身出站：CCT 文件与 Vault（02d 起 Vault Client 在存在 Supplier 时附加 Token，未授权则失败关闭）。
      # payment-service 保留给既有 Platform → Payment 目标登记。
      platform-support-service:
        targets: [payment-service, client-master-service, vault-service]
        purposes: [GENERAL]
      # Payment 出站（第 12 步）：卡工具创建与一次性读卡票据签发访问 card-service（design/05 §4）。
      payment-service:
        targets: [card-service]
        purposes: [GENERAL]

# 本地认证适配器的合成测试密钥（RSA 2048 PKCS#8 与 32 字节 HMAC，Base64）；只用于 Loopback Mock，不对应任何真实环境。
# 全局 Mocker 由同一私钥推导 ACTIVE 公钥 JWK 写入 t_jwt_signing_key。
OPERATIONS_LOCAL_SIGNING_PRIVATE_KEY_BASE64: ""
OPERATIONS_LOCAL_HMAC_KEY_BASE64: "1syKWMdr+yUdeVJrtnvE9F4NjzO78scpQBeOIPNjGic="
OPERATIONS_LOCAL_HMAC_KEY_VERSION: 1
CLIENT_LOCAL_SIGNING_PRIVATE_KEY_BASE64: ""
CLIENT_LOCAL_HMAC_KEY_BASE64: "mjJ4rge5AkXkOxpdD2ypxApjtRpH4J2vY2V0tqkWslM="
CLIENT_LOCAL_HMAC_KEY_VERSION: 1
