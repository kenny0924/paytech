# Data ID: payment-service.yaml
# Namespace: 按环境选择；本地为 mor-local。Group: DEFAULT_GROUP。
# 本地参数模板；上传前按目标环境调整。密码和实例 Snowflake 坐标由进程环境提供。

server:
  address: 127.0.0.1
  port: 18103
  servlet:
    context-path: /payment

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/mor_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: payment_app
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      connect-timeout: 2s
      timeout: 2s
  # PaymentSucceeded 发布；账号密码由 PAYMENT_RABBITMQ_USERNAME / PAYMENT_RABBITMQ_PASSWORD 提供，不写入模板。
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    virtual-host: /mor-local
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# 本地补偿任务（事务内登记、提交后发布）；进程参数启动时读取，修改需重启。
compensation:
  enabled: true

redis:
  coordination:
    enabled: true
    resource-lock:
      wait-time: 500ms
      lease-time: 30s

# PaymentSucceeded 双写：旧 topic_payment_result 与 payment.events 新信封（design/08 §3）。
messaging:
  producer:
    service: payment
  publisher:
    # 第 08 步接入订阅者后改回 FAIL：在此之前 payment.events 没有订阅队列，未路由的信封记 WARN 与
    # messaging.published{outcome=unroutable} 后视为成功，避免 PaymentSucceeded 补偿任务持续失败（旧 Topic 仍按 mandatory 严格发布）。
    unroutable-policy: ACK_AND_WARN

payment:
  # 能力代码目录随渠道配置迁到 channel-connector（channel-connector-service.yaml）。
  execution:
    # 零值禁用新申请；本地合成流程可配置 PT5M，实际期限受 Intent/Card 限制。
    instrument-preparation-window: PT0S
  # card.fingerprint-key（卡指纹与凭证摘要的 HMAC 密钥）必填但不写入模板或 Nacos，由环境变量 PAYMENT_CARD_FINGERPRINT_KEY 提供；
  # 每张卡的数据加密密钥由 Vault 托管（数据类型 PAYMENT_CARD_DEK），不在 Payment 配置。
  outbound:
    # channel-connector 与 Risk 统一评估的对方 context path 与读取超时；修改需重启。
    channel-connector-context-path: ""
    channel-candidate-read-timeout: 2s
    channel-operation-read-timeout: 35s
    risk-context-path: ""
    # Risk 读超时后用同一请求重试一次，仍失败则风控失败关闭。
    risk-read-timeout: 1s

vault:
  client:
    caller-service: payment-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 5s
