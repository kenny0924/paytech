server:
  address: 127.0.0.1
  port: 18103
  servlet:
    context-path: /payment

spring:
  application:
    name: payment-orchestration-service
  cloud:
    nacos:
      config:
        # 启用 nacos Profile 后，从配置中心加载服务配置。
        enabled: false
      discovery:
        # 注册本服务并发现 Platform、Vault 等内部服务；地址与命名空间由部署环境注入。
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:mor-local}"
  datasource:
    url: "${MOR_PAYMENT_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${MOR_PAYMENT_DB_USERNAME:payment_app}"
    password: "${MOR_PAYMENT_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: "SET time_zone = '+00:00'"
  sql:
    init:
      mode: never
  data:
    redis:
      host: "${MOR_REDIS_HOST:127.0.0.1}"
      port: "${MOR_REDIS_PORT:16379}"
      password: "${MOR_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: "${PAYMENT_RABBITMQ_HOST:127.0.0.1}"
    port: "${PAYMENT_RABBITMQ_PORT:5672}"
    username: "${PAYMENT_RABBITMQ_USERNAME:}"
    password: "${PAYMENT_RABBITMQ_PASSWORD:}"
    virtual-host: "${PAYMENT_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    # 发布确认与不可路由退回：PaymentSucceeded 补偿 Handler 等待 Broker 确认后才算发布成功。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jmx:
    enabled: false

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}] %kvp"

web:
  logging:
    # 工具凭据和后续交互指令均不进入普通访问日志。
    metadata-only-path-prefixes:
      - /

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

# paytech-compensation-event：支付成功事务内登记发布任务，提交后执行；XXL-Job 兜底唤醒沿用组件默认。
compensation:
  enabled: true

redis:
  coordination:
    enabled: true
    resource-lock:
      wait-time: 500ms
      lease-time: 30s

payment:
  channel:
    capability-definitions:
      "[ACTION.PAY]": { value-type: BOOLEAN }
      "[ACTION.AUTHORIZE]": { value-type: BOOLEAN }
      "[ACTION.AUTHENTICATE]": { value-type: BOOLEAN }
      "[ACTION.CAPTURE]": { value-type: BOOLEAN }
      "[ACTION.VOID]": { value-type: BOOLEAN }
      "[ACTION.REFUND]": { value-type: BOOLEAN }
      "[AMOUNT.MIN]": { value-type: DECIMAL }
      "[AMOUNT.MAX]": { value-type: DECIMAL }
      "[SECURITY.3DS_MODE]": { value-type: CODE, allowed-codes: [REQUIRED, SUPPORTED, UNSUPPORTED] }
  execution:
    # 必须显式配置有效窗口；零值仅禁用首次申请，不影响原工具重放。
    instrument-preparation-window: "${PAYMENT_INSTRUMENT_PREPARATION_WINDOW:PT0S}"
  card:
    # 卡指纹的 HMAC-SHA256 密钥（Base64，解码后至少 32 字节）；必填，缺失则启动失败。
    # 只经环境变量注入，不写入 Nacos 或版本库；每张卡的数据加密密钥由 Vault 托管，不在此配置。
    fingerprint-key: "${PAYMENT_CARD_FINGERPRINT_KEY:}"
  identifier:
    region-id: "${PAYMENT_SNOWFLAKE_REGION_ID}"
    worker-id: "${PAYMENT_SNOWFLAKE_WORKER_ID}"

vault:
  client:
    caller-service: payment-orchestration-service
    service-id: vault-service
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
    info:
      access: read-only
    prometheus:
      access: read-only

---
spring:
  config:
    activate:
      on-profile: nacos
    import:
      - "optional:nacos:mor-common.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=false"
      - "nacos:payment-orchestration-service.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:mor-local}"
        group: "${NACOS_GROUP:DEFAULT_GROUP}"
        username: "${NACOS_USERNAME:}"
        password: "${NACOS_PASSWORD:}"
