server:
  address: ${OPERATIONS_BFF_BIND_ADDRESS:127.0.0.1}
  port: 18201
  forward-headers-strategy: none

spring:
  application:
    name: operations-console-bff
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:mor-local}
        ip: ${OPERATIONS_BFF_BIND_ADDRESS:127.0.0.1}
  jmx:
    enabled: false

logging:
  pattern:
    level: "%5p %kvp"

management:
  server:
    address: 127.0.0.1
    port: 19201
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

vault:
  client:
    # Vault 以 VAULT_ADMIN_CALLERS 只接受 operations-console-bff 的管理请求；业务 VaultClient 本 BFF 不使用。
    admin-enabled: true
    connect-timeout: 2s
    read-timeout: 5s

operations:
  console-origin: ${OPERATIONS_CONSOLE_ORIGIN:https://operations-console.local.test}
  test-http-enabled: ${OPERATIONS_TEST_HTTP_ENABLED:false}
  # ledger 与 account 不注册 Nacos（服务 pom 的 Enforcer 禁止 Nacos 依赖），BFF 以固定私网地址直连，不经 LoadBalancer/Discovery。
  # 只允许不含路径、Query 与 Fragment 的 http(s) 地址；auto 测试指向本地 Simulator。
  ledger-base-url: ${OPERATIONS_LEDGER_BASE_URL:http://127.0.0.1:18105}
  account-base-url: ${OPERATIONS_ACCOUNT_BASE_URL:http://127.0.0.1:18114}
  # billing 同样不注册 Nacos，规则同上。
  billing-base-url: ${OPERATIONS_BILLING_BASE_URL:http://127.0.0.1:18113}
  # 关账发起、重开发起与关账/重开审批在 ledger 同步执行；只对这三个调用放宽读取超时，须小于 Gateway 路由响应超时上限 10 秒。
  ledger-long-running-read-timeout: ${OPERATIONS_LEDGER_LONG_RUNNING_READ_TIMEOUT:9s}
  # reconciliation 运营接口固定私网地址（与 ledger / account / billing 同一接入方式），规则同上；auto 测试指向本地 Simulator。
  reconciliation-base-url: ${OPERATIONS_RECONCILIATION_BASE_URL:http://127.0.0.1:18115}
  # Platform 数据查询（数据源连接检查、模板试运行与执行）的读取超时，须小于 Gateway 路由响应超时上限 10 秒。
  data-query-read-timeout: ${OPERATIONS_DATA_QUERY_READ_TIMEOUT:9s}

web:
  logging:
    metadata-only-path-prefixes:
      - /auth
      - /authorization
      - /iam
      - /audit
      - /gateway-admin
      - /console-admin
      - /permission-admin
      - /api-credential-admin
      - /api-scope-admin
      - /decision-dictionaries
      - /decision-rule-sets
      - /decision-releases
      - /decision-flows
      - /decision-variables
      # 名单成员查询与加入请求含主体原值（IP、卡指纹、消费者引用等），只记元数据。
      - /risk-lists
      # 评估解释含冻结输入原值（IP、User-Agent、卡指纹、消费者引用等），只记元数据。
      - /risk-decisions
      - /external-api-admin
      # 审核详情含申请人个人资料，命令含内部理由与客户可见说明，只记元数据。
      - /client-onboarding-admin
      # 人工加/解密请求与响应含原值或 Token，只记元数据。
      - /vault-admin
      # 通知模板正文与预览示例参数可能含业务文案或样例值，只记元数据。
      - /notification-admin
      # 新建端点与轮换的响应含签名密钥明文，只记元数据。
      - /webhook-admin
      # 币种启停原因与权限维护一致，只记元数据。
      - /currency-admin
      # 数据源新建、修改与测试连接的请求含被查库密码；试运行与执行的请求含查询参数值、响应含结果行，只记元数据。
      - /data-query-admin/v1/data-sources
      - /data-query-admin/v1/data-source-connection-tests
      - /data-query-admin/v1/template-trials
      - /data-query/v1
      # 渠道技术账号配置请求含渠道参数与凭据明文，账号接口只记元数据。
      - /channel-admin/v1/channel-accounts
      # 银行账户新建请求含银行账号明文（I-05），银行账户接口只记元数据。
      - /finance/reconciliation/v1/cash-accounts
