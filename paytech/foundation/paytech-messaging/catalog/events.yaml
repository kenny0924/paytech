# 跨服务 RabbitMQ 领域事件目录 v1（design/08 §5）。
# 每个事件一条；producer / consumers 使用 01 §3 的服务名；构建期由 YamlEventCatalog 与 ArchUnit 校验。
# 新增或修改登记须同时更新发布端、消费 Handler 的 @DomainEventHandler 与对应设计文档。
events:
  # Payment 支付成功（第 05 步按实现核对，第 08 步复核）：aggregateId 为支付尝试 ID，aggregateVersion 取 t_payment_attempt.version
  # （可能跳号，故 strictOrder=false）。acquiring 第 08 步切到 acquiring.payment.p0..p3（Handler strictOrder=false、HANDLER_MANAGED），
  # 旧 Topic 停发。第 12 步升 v2（design/05 §2.3），在 v1 字段之后追加 instrumentRef、consentToSave、customerId，供 card 标记凭证
  # 已验证并存卡（card.payment.p0..p3）；acquiring 忽略新增字段。2026-10-22 BIN 库需求在 v2 末尾再追加可空 cardBrand、fundingType、
  # cardLevel（支付工具 Token 冻结的 BIN 库卡属性，未识别或非卡支付为 null），只追加可空字段故 schemaVersion 仍为 2；billing 写入
  # card_network、funding_type、card_level 由计费需求 B 接入，届时再登记为消费方。
  - eventType: PaymentSucceeded
    schemaVersion: 2
    producer: payment
    aggregateType: PAYMENT_ATTEMPT
    aggregateVersionField: version
    consumers: [acquiring, card]
    strictOrder: false
    payloadSchemaRef: paytech-payment-api/event/PaymentSucceeded/v2
  # 客户审核结论（第 06 步按实现核对）：compliance 发布 v1，Payload 与旧 topic_risk_client_review 报文同字段同顺序；
  # aggregateType 与旧报文 sourceType 一致为 DD_CASE，aggregateId 为审核主任务 ID，aggregateVersion 取 Payload caseVersion
  # （t_due_diligence_case.version，登记、核验、分类都会推进，可能跳号，故 strictOrder=false）。client-master 第 08 步切到
  # client-master.compliance.p0..p3（Handler strictOrder=false、HANDLER_MANAGED），旧 topic_risk_client_review 停发。
  # 2026-10-27 全球合规入驻切片 1 升 v2（technique S-02）：在 v1 字段后追加 caseType、roundNo、tier、riskRating、dueTime、errors[]，
  # outcome 增 EXPIRED（退回超期，client-master 把申请置 WITHDRAWN）。client-master 先兼容 schemaVersion 1 与 2 并上线，compliance 再发 v2。
  - eventType: ClientReviewDecided
    schemaVersion: 2
    producer: compliance
    aggregateType: DD_CASE
    aggregateVersionField: caseVersion
    consumers: [client-master]
    strictOrder: false
    payloadSchemaRef: paytech-compliance-api/event/ClientReviewDecided/v2
  # 角色资格状态迁移（2026-10-27 全球合规入驻切片 1，R7）：compliance 在案件决定、运营手工登记与撤销的同一本地事务登记补偿任务
  # QUALIFICATION_CHANGED，提交后回读 t_qualification_state_change 与决定发布。aggregateId 为 qualification_id，aggregateVersion 取
  # 该次迁移的资格版本（同一资格连续递增）；client-master 只按 status 幂等处理（REVOKED → Client SUSPENDED），故 strictOrder=false。
  # Payload 见 paytech-compliance-api 的 com.paytech.compliance.api.event.QualificationChangedPayload。
  - eventType: QualificationChanged
    schemaVersion: 1
    producer: compliance
    aggregateType: ROLE_QUALIFICATION
    aggregateVersionField: qualificationVersion
    consumers: [client-master]
    strictOrder: false
    payloadSchemaRef: paytech-compliance-api/event/QualificationChanged/v1
  # 唯一计费事实（决定 2026-10-19 计费事实引擎；需求 billing-计费事实模型重构与渠道成本迁出，替代原经济事实事件）：Payload 为
  # paytech-billing-api 的 com.paytech.billing.api.fact.BillingFactPayload，含头 + 外部引用（refs）+ 全部明细行（每行付方 / 收方）。
  # aggregateId 为 factId，aggregateVersion 取 t_billing_fact.fact_version（替代链递增），occurredAt 为批准（AUTO 为登记）时间。
  # businessTime 是 ledger 过账日期来源；refs 的 CLEARING_ACCOUNT 是 ledger 渠道账户 Owner 来源。不同事实之间无顺序依赖，故 strictOrder=false。
  # 消费方：account（SHARED 事务）维护 Owner 明细账；reconciliation（2026-10-20 对账切片 1）只处理 PAYMENT / REFUND 生成平台流水，渠道交易引用
  # 取 refs 的 CHANNEL_TRANSACTION_REF（refId + 可空 externalReferenceType / externalTransactionId，只新增可空字段故 schemaVersion 仍为 1）。
  # ledger 不消费本事件，改消费 AccountPosted 并经 billing-api 读取事实。
  - eventType: BillingFactRecorded
    schemaVersion: 1
    producer: billing
    aggregateType: BILLING_FACT
    aggregateVersionField: factVersion
    consumers: [account, reconciliation]
    strictOrder: false
    payloadSchemaRef: paytech-billing-api/event/BillingFactRecorded/v1
  # account 过账批次（决定 2026-10-18，2026-10-19 技术方案 2.1 / 2.2）：account 每生成一个 t_account_posting（事实入账或余额桶移动）
  # 发布一次，ledger 按批次过账控制科目。Payload 为 paytech-account-api 的 com.paytech.account.api.event.AccountPostedPayload。
  # aggregateId 为过账流身份 {OE|FE}.{entityId}.{currency}.{shardNo}（例如 OE.AE001.USD.0、FE.8001.USD.0；用 . 分隔，因 aggregateId
  # 是路由键且 event_key 以 : 分段），aggregateVersion 为 postingSequence（同一流从 1 连续递增，strictOrder=true）。
  # ledger 的 AccountPosted Handler 为 HANDLER_MANAGED：事务外校验首条序号并经 billing-api 读事实，事务内过账；缺口进入
  # ledger.account.dlq 后经 ledger POST /posting-streams/v1/catch-up 追平，不重放死信。
  - eventType: AccountPosted
    schemaVersion: 1
    producer: account
    aggregateType: ACCOUNT_POSTING
    aggregateVersionField: postingSequence
    consumers: [ledger]
    strictOrder: true
    payloadSchemaRef: paytech-account-api/event/AccountPosted/v1
  # 结算限制变化（C3、D27，design/07；第 06 步核对）：阶段 0 仅 Schema（compliance-api SettlementRestrictionChangedPayload），无发布调用方；
  # aggregateId 为 control_id，aggregateVersion 取 t_settle_control_state_change.aggregate_version（同一控制连续递增，满足 strictOrder）。
  - eventType: SettlementRestrictionChanged
    schemaVersion: 1
    producer: compliance
    aggregateType: SETTLEMENT_CONTROL
    aggregateVersionField: aggregateVersion
    consumers: [payout, account]
    strictOrder: true
    payloadSchemaRef: paytech-compliance-api/event/SettlementRestrictionChanged/v1
  # 合同状态变更（2026-10-19 六层定价 technique.md §2.8，B 线）：commercial 在合同激活 / 终止的本地事务登记补偿任务
  # AGREEMENT_STATUS_CHANGED，提交后由 AgreementStatusChangedHandler 回读合同行发布；aggregateId 为合同 ID，aggregateVersion 取
  # 合同 BCR Root 的 changeVersion（同一合同的其他写入也推进该版本，事件之间会跳号，故 strictOrder=false）。acquiring 用于支付前
  # 新鲜门禁，消费 Handler 由 acquiring 接入时登记。Payload 见 paytech-commercial-api 的 com.paytech.commercial.api.event.AgreementStatusChangedPayload。
  - eventType: AgreementStatusChanged
    schemaVersion: 1
    producer: commercial
    aggregateType: AGREEMENT
    aggregateVersionField: changeVersion
    consumers: [acquiring]
    strictOrder: false
    payloadSchemaRef: paytech-commercial-api/event/AgreementStatusChanged/v1
  # 商业条款版本生效（2026-10-19 六层定价 technique.md §2.8，C 线）：commercial 在条款版本激活（运营激活或定时激活作业）的本地事务
  # 登记补偿任务 COMMERCIAL_TERM_VERSION_ACTIVATED，提交后由 CommercialTermVersionActivatedHandler 回读方案与唯一 ACTIVE 版本发布；
  # aggregateId 为方案 ID，aggregateVersion 取方案 BCR Root 的 changeVersion（同一方案的其他写入也推进该版本，事件之间会跳号，故
  # strictOrder=false）。消费 Handler 由 acquiring 接入时登记。Payload 见 paytech-commercial-api 的
  # com.paytech.commercial.api.event.CommercialTermVersionActivatedPayload。
  - eventType: CommercialTermVersionActivated
    schemaVersion: 1
    producer: commercial
    aggregateType: COMMERCIAL_TERM_PLAN
    aggregateVersionField: changeVersion
    consumers: [acquiring]
    strictOrder: false
    payloadSchemaRef: paytech-commercial-api/event/CommercialTermVersionActivated/v1
  # 对账四类事件（2026-10-20 需求 reconciliation-渠道资金对账切片1，technique.md §2.4）：reconciliation 在本地事务登记同名补偿发布任务，
  # 提交后由 Handler 回读本库发布到 reconciliation.events。四个事件的聚合都只发一次，aggregateVersion 固定为 1（载荷类常量
  # AGGREGATE_VERSION，载荷不带版本字段，故 aggregateVersionField 记为 none）；不同聚合之间无顺序依赖，strictOrder=false。
  # 消费方暂为空（technique D-08）：billing 接入 COST_ADJUSTMENT / CHANNEL_BATCH_RECONCILED / CHANNEL_SETTLEMENT / RECON_ADJUSTMENT 时
  # 随 billing 需求 B 登记。Payload 见 paytech-reconciliation-api 的 com.paytech.reconciliation.api.event 包。
  # 实际渠道费与预估不同：渠道账单对平时，本账单使其变为 SETTLED 的每笔平台流水发一条；aggregateId 为平台流水 ID。
  - eventType: ActualChannelCostConfirmed
    schemaVersion: 1
    producer: reconciliation
    aggregateType: PLATFORM_TXN
    aggregateVersionField: none
    consumers: []
    strictOrder: false
    payloadSchemaRef: paytech-reconciliation-api/event/ActualChannelCostConfirmed/v1
  # 渠道账单对平：aggregateId 为渠道账单 ID（一个批次号的一个导入版本），含已归类调整行与本账单结清的平台流水。
  - eventType: ChannelBatchReconciled
    schemaVersion: 1
    producer: reconciliation
    aggregateType: CHANNEL_STATEMENT
    aggregateVersionField: none
    consumers: []
    strictOrder: false
    payloadSchemaRef: paytech-reconciliation-api/event/ChannelBatchReconciled/v1
  # 渠道到账确认：每条已确认的渠道预期银行流水匹配一条；aggregateId 为银行匹配 ID（按匹配 ID 幂等）。
  - eventType: ChannelSettlementConfirmed
    schemaVersion: 1
    producer: reconciliation
    aggregateType: BANK_MATCH
    aggregateVersionField: none
    consumers: []
    strictOrder: false
    payloadSchemaRef: paytech-reconciliation-api/event/ChannelSettlementConfirmed/v1
  # 对账调整批准：平台流水、预期银行流水、银行流水的 CLASSIFY 处置批准时发一次；aggregateId 为处置 ID。
  - eventType: ReconAdjustmentApproved
    schemaVersion: 1
    producer: reconciliation
    aggregateType: RECON_RESOLUTION
    aggregateVersionField: none
    consumers: []
    strictOrder: false
    payloadSchemaRef: paytech-reconciliation-api/event/ReconAdjustmentApproved/v1
  # 工作流业务回调（决定 2026-10-22-workflow-into-platform-support，需求 platform-support-工作流 technique 4.2）：节点或实例状态变化
  # 命中流程版本冻结的 CALLBACK 规则时，由 Platform 补偿 Handler 发布到 platform-support.events。Payload 为 paytech-platform-support-api 的
  # com.paytech.platform.support.api.workflow.event.WorkflowCallbackRaisedPayload，不携带表单值或文件；eventId 为 workflow-callback:{callbackId}。
  # aggregateId 为实例 ID，aggregateVersion 为变化后的实例版本（可能跳号，strictOrder=false）。订阅方按 callbackCode 过滤、以 eventId 幂等，
  # 事件只是通知，执行前须自行校验业务事实（D13）；目前没有订阅方。
  - eventType: WorkflowCallbackRaised
    schemaVersion: 1
    producer: platform-support
    aggregateType: WORKFLOW_INSTANCE
    aggregateVersionField: instanceVersion
    consumers: []
    strictOrder: false
    payloadSchemaRef: paytech-platform-support-api/event/WorkflowCallbackRaised/v1
  # 渠道支付通知（需求 payment-3DS全链路 technique 3.3.5）：channel-connector 收到并验签通过一条支付渠道的支付结果通知后，由补偿 Handler
  # CHANNEL_PAYMENT_NOTIFIED 发布到 channel-connector.events。Payload 为 paytech-channel-connector-api 的
  # com.paytech.channel.connector.api.event.ChannelPaymentNotifiedPayload（channelId、channelAccountId、merchantReference=支付尝试 ID、
  # channelTransactionRef、reportedStatus、receivedAt），不含通知原文、签名与金额。aggregateId 为 channel_callback_id，回调不可变，
  # aggregateVersion 固定为 1，strictOrder=false。payment 的 Handler 为 HANDLER_MANAGED：只把通知当作去查单的信号，经确认支付结果推进。
  - eventType: ChannelPaymentNotified
    schemaVersion: 1
    producer: channel-connector
    aggregateType: CHANNEL_CALLBACK
    aggregateVersionField: aggregateVersion
    consumers: [payment]
    strictOrder: false
    payloadSchemaRef: paytech-channel-connector-api/event/ChannelPaymentNotified/v1
  # 订单支付成功（需求 billing-支付事实自动登记 technique 4.3，S13）：acquiring 落地 PaymentSucceeded 推进订单为 PAID 的同一事务登记补偿
  # 任务 ORDER_PAYMENT_SUCCEEDED，提交后由补偿 Handler 发布到 acquiring.events。Payload 在 paytech-acquiring-core 的
  # com.paytech.acquiring.domain.order.OrderPaymentSucceededPayload：订单冻结商业字段在前、支付事实在后，ID 与金额为十进制字符串，
  # 时间为 UTC RFC 3339，缺失为 JSON null。aggregateId 为订单 ID，aggregateVersion 为推进 PAID 后的 t_commerce_order.version
  # （一个订单只成功一次，版本可能跳号，strictOrder=false）。已关闭订单补记支付投影与重复事件不发布。billing 据此登记 AUTO PAYMENT 计费事实。
  - eventType: OrderPaymentSucceeded
    schemaVersion: 1
    producer: acquiring
    aggregateType: ORDER
    aggregateVersionField: version
    consumers: [billing]
    strictOrder: false
    payloadSchemaRef: paytech-acquiring-api/event/OrderPaymentSucceeded/v1
