server:
  address: 127.0.0.1
  port: 18102
  servlet:
    context-path: /commerce

spring:
  application:
    name: acquiring-service
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:public}"
    loadbalancer:
      retry:
        enabled: false
      cache:
        enabled: false
  http:
    clients:
      imperative:
        factory: http-components
    serviceclient:
      payment-service:
        base-url: lb://payment-service/payment
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      card-service:
        base-url: lb://card-service
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      counterparty-service:
        base-url: lb://counterparty-service
        connect-timeout: 2s
        read-timeout: 3s
        redirects: dont-follow
      risk-decision-service:
        base-url: lb://risk-decision-service
        connect-timeout: 2s
        read-timeout: 1s
        redirects: dont-follow
      # Checkout 商业上下文真实解析，仅 acquiring.commercial.resolution-mode=REAL 时注册客户端。
      commercial-service:
        base-url: lb://commercial-service
        connect-timeout: 2s
        read-timeout: 3s
        redirects: dont-follow
      platform-support-service:
        base-url: lb://platform-support-service/platform-support
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
  data:
    redis:
      host: "${MOR_REDIS_HOST:127.0.0.1}"
      port: "${MOR_REDIS_PORT:16379}"
      password: "${MOR_REDIS_PASSWORD:}"
      database: 0
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: "${MOR_COMMERCE_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_acquiring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${MOR_COMMERCE_DB_USERNAME:acquiring_app}"
    password: "${MOR_COMMERCE_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  sql:
    init:
      mode: never
  # Payment 支付结果消费（paytech-messaging 分区队列 acquiring.payment.p0..p3）；凭据只从环境变量注入。
  rabbitmq:
    host: "${COMMERCE_RABBITMQ_HOST:127.0.0.1}"
    port: "${COMMERCE_RABBITMQ_PORT:5672}"
    username: "${COMMERCE_RABBITMQ_USERNAME:}"
    password: "${COMMERCE_RABBITMQ_PASSWORD:}"
    virtual-host: "${COMMERCE_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    # 发布确认与不可路由退回：OrderPaymentSucceeded 补偿 Handler 等待 Broker 确认后才算发布成功。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jmx:
    enabled: false

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

# paytech-messaging 消费端（design/08 §3–§4）：订阅 payment.events，声明 acquiring.payment.hash（x-consistent-hash）与
# acquiring.payment.p0..p3（Quorum、单活消费者、delivery-limit 5、DLX acquiring.payment.dlx → acquiring.payment.dlq）；
# 消费登记 t_consumed_event / t_consumed_aggregate_version 与业务表同库。上线后修改分区数需先排空分区队列。
# 发布端：声明 acquiring.events（Durable Fanout）并提供 DomainEventPublisher，供 OrderPaymentSucceeded 补偿 Handler 使用；
# 订阅方（billing）未声明队列时视为发布失败，由补偿任务重试。
messaging:
  producer:
    service: acquiring
  publisher:
    unroutable-policy: FAIL
  consumer:
    service: acquiring
  consumers:
    payment:
      partitions: 4

# 实例 ID（实例清单 instance.id，01 §5）：领域事件信封 instanceId。
paytech:
  instance-id: "${PAYTECH_INSTANCE_ID:main}"

redis:
  coordination:
    enabled: true

# 内部调用身份（D26）：默认 OFF；YAML 中必须带引号，裸 OFF 会被解析为布尔 false。
internal-auth:
  mode: "${ACQUIRING_INTERNAL_AUTH_MODE:OFF}"

acquiring:
  commercial:
    # Checkout 商业解析模式：MOCK（缺省）使用固定 AE001 + PARTNER Mock；REAL 调用 commercial-service 并冻结商业关系快照。修改后需重启。
    resolution-mode: "${ACQUIRING_COMMERCIAL_RESOLUTION_MODE:MOCK}"
  event:
    # OrderPaymentSucceeded 信封身份：sourceService 与 messaging.producer.service 一致。
    source-service: acquiring
    instance-id: "${paytech.instance-id}"
  payment:
    card-payment-method-code: "${COMMERCE_CARD_PAYMENT_METHOD_CODE}"
  checkout:
    public-origin: "${COMMERCE_CHECKOUT_PUBLIC_ORIGIN}"
  identifier:
    region-id: "${COMMERCE_SNOWFLAKE_REGION_ID}"
    worker-id: "${COMMERCE_SNOWFLAKE_WORKER_ID}"
  # 订单过期扫描（XXL-Job orderExpiryScan，分片广播）：每次执行按分片读取到期仍为 CREATED/OPEN 的订单。
  order-expiry:
    # 每页订单数，1—1000。
    batch-size: 200
    # 单次执行最多页数，1—1000；限制单次任务时长，剩余订单留待下一轮。
    max-batches: 50
    # 终止意图写入后仍 PENDING 的告警阈值；超过后每轮记一条 WARN 转人工，订单保持 OPEN。
    pending-alert-after: 24h

web:
  logging:
    metadata-only-path-prefixes:
      - /client-gateway-api/v1
      - /customer-gateway-api/v1

management:
  server:
    port: 19102
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
