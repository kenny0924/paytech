# compliance 配置字段清单，同时作为 ComplianceMockTestBase（mock Profile）的可运行配置。
# 本文件列全 compliance 自定义配置、已接入公共组件的配置及实际使用的框架配置；配置字段变化必须同步本文件。
# 固定账号密码仅适用于仓库 local-environment 的 Loopback 本地测试中间件（UNIT_TEST_GUIDE 第 198、302 条），IDE/Maven 无需设置环境变量；如本机实例密码不同，可用 COMPLIANCE_TEST_* 或 MOR_* 环境变量覆盖。

# ==================== 中间件、框架与公共组件配置 ====================

server:
  address: 127.0.0.1
  # 测试使用随机端口
  port: 0

spring:
  application:
    name: compliance-service
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  sql:
    init:
      mode: never
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false
        server-addr: "127.0.0.1:8848"
        namespace: mor-local
        ip: 127.0.0.1
  datasource:
    url: "jdbc:mysql://127.0.0.1:13306/mor_compliance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: compliance_app
    password: "${COMPLIANCE_TEST_DB_PASSWORD:${MOR_COMPLIANCE_DB_PASSWORD:local-compliance-change-me-2026}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        connectTimeout: 2000
        socketTimeout: 2000
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: "${COMPLIANCE_TEST_RABBITMQ_USERNAME:${MOR_RABBITMQ_USER:mor_local}}"
    password: "${COMPLIANCE_TEST_RABBITMQ_PASSWORD:${MOR_RABBITMQ_PASSWORD:c4a5fc41a6c65710372fab6bd28e51602d1cd25eeffe0360}}"
    virtual-host: "${COMPLIANCE_TEST_RABBITMQ_VHOST:${MOR_RABBITMQ_VHOST:/mor-local}}"
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-missing-creator-properties: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

management:
  server:
    # 随机管理端口；测试不访问 Actuator。
    port: 0
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

# paytech-mvc-web-starter：这些路径只记录请求元数据，不记录 Body。
web:
  logging:
    metadata-only-path-prefixes:
      - /internal/due-diligence/material-requirements
      - /client-onboarding-review
      - /client-onboarding-admin
      - /compliance-admin

# paytech-compensation-event：本地补偿任务，事务内登记、提交后执行。
compensation:
  enabled: true
  # 多实例 Claim/Lease 的实例标识；测试固定值。
  instance-id: compliance-test
  # 单次 Claim 的租约时长。
  lease-duration: 2m
  # 兜底扫描单批条数。
  scanner-batch-size: 100
  coordinator:
    core-size: 10
    maximum-size: 20
    queue-capacity: 80
    keep-alive: 60s
  handler:
    maximum-concurrency: 20

# paytech-xxl-job-starter（随 compensation-event 引入）：测试不连接调度中心。
xxl:
  job:
    admin:
      addresses: ""
      access-token: ""
      timeout: 3
    executor:
      enabled: false
      app-name: compliance-service
      address: ""
      ip: 127.0.0.1
      port: 0
      log-path: ./logs/xxl-job
      log-retention-days: 30
      excluded-packages: "org.springframework.,spring."

# ==================== paytech-messaging 发布端 ====================

messaging:
  producer:
    service: compliance
    sequencer:
      enabled: true
  publisher:
    # 与生产一致：FAIL。测试 Probe 为每例绑定临时队列观察 compliance.events，使发布不依赖共享 Broker 上的订阅队列。
    unroutable-policy: FAIL

# 实例 ID 与内部调用身份（D26）：测试保持 OFF。
paytech:
  instance-id: compliance-test
internal-auth:
  mode: "OFF"

# ==================== compliance 自定义配置 ====================

compliance:
  identifier:
    # Snowflake 区域与节点号；生产必须由部署注入，测试固定为 0 / 1（与 risk-decision 测试的 0 / 0 不同）。
    region-id: 0
    worker-id: 1

onboarding:
  review:
    # I01/I02 审核登记入口与 /client-onboarding-admin 管理入口开关；生产缺省关闭，mock 环境开启以便所有新规范测试共享同一应用上下文。
    # 审核结论经 compensation 补偿任务发布到 compliance.events（ClientReviewDecided v1）。
    enabled: true
  materials:
    # 材料目录入口开关；生产缺省关闭，mock 环境开启以便所有新规范测试共享同一应用上下文。
    enabled: true
    # 资格类型到通用材料程序的映射 JSON；每类最多一行。用例经 MaterialProgramMocker 覆盖，每例结束恢复此值。
    programs-json: '[{"qualificationType":"INDIVIDUAL_KYC","programCode":"CLIENT_INDIVIDUAL_GENERIC"},{"qualificationType":"ORGANIZATION_KYB","programCode":"CLIENT_ORGANIZATION_GENERIC"},{"qualificationType":"RELATED_PERSON_KYC","programCode":"RELATED_PERSON_GENERIC"}]'
