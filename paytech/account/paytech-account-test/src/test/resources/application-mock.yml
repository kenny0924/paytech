# account-service 配置字段清单，同时作为 Mock 测试的可运行配置。
# 只连接仓库 local-environment 的 Loopback MySQL；固定凭据为隔离本地测试账号，可用环境变量覆盖。

# ==================== 中间件、框架与公共组件配置 ====================

server:
  address: 127.0.0.1
  port: 0

spring:
  application:
    name: account-service
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  datasource:
    # 共库过渡（任务卡 07）：account_app 在 mor_ledger 只有 SELECT。
    url: "${ACCOUNT_TEST_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${ACCOUNT_TEST_DB_USERNAME:account_app}"
    password: "${ACCOUNT_TEST_DB_PASSWORD:bc991f08e64ba1551ce6e2f8e610defc65e511dfbaf1e37c}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

management:
  server:
    # 独立管理端口；测试随机分配，由 @LocalManagementPort 读取。
    address: 127.0.0.1
    port: 0
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

# ==================== Account 系统自定义配置 ====================

account:
  identifier:
    # Snowflake Region / Worker 标识；生产无默认值且必填，修改需重启。测试进程固定 0/0。
    region-id: 0
    worker-id: 0
  test:
    # 测试夹具专用写连接：共库过渡期 account_app 只读，夹具经 ledger 的测试账号写入 t_ledger_book / t_account。
    fixture-datasource:
      url: "${LEDGER_TEST_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      username: "${LEDGER_TEST_DB_USERNAME:ledger_app}"
      password: "${LEDGER_TEST_DB_PASSWORD:05a148d75d6913440f13b66dd4f793519923433100eb1d0a}"
