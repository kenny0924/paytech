# account-service 配置字段清单，同时作为 Mock 测试的可运行配置。
# 只连接仓库 local-environment 的 Loopback MySQL（mor_account）与 RabbitMQ；固定凭据为隔离本地测试账号，可用环境变量覆盖。

# ==================== 中间件、框架与公共组件配置 ====================

server:
  address: 127.0.0.1
  port: 0

spring:
  config:
    # 复用仓库已启动的本地 RabbitMQ 凭据；唯一锚点 paytech.local-environment.dir 由父 POM 经 Surefire 注入（10 §4.4）。
    import:
      - "optional:file:${paytech.local-environment.dir}/.env.local[.properties]"
  application:
    name: account-service
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  datasource:
    # 第 11b 步起连接自有库 mor_account，account_app 只有本库 DML 权限。
    url: "${ACCOUNT_TEST_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_account?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${ACCOUNT_TEST_DB_USERNAME:account_app}"
    password: "${ACCOUNT_TEST_DB_PASSWORD:bc991f08e64ba1551ce6e2f8e610defc65e511dfbaf1e37c}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  # 仓库 local-environment 的本机 RabbitMQ；凭据只来自 .env.local 或同名环境变量。测试扮演 billing 向 billing.events 发布，需要发布确认。
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: "${MOR_RABBITMQ_USER}"
    password: "${MOR_RABBITMQ_PASSWORD}"
    virtual-host: "${MOR_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
  # ledger-api 与 billing-api 由 EnableMockHttpServer 的随机 Loopback 端口承载，真实客户端直连该地址。
  http:
    clients:
      imperative:
        factory: jdk
    serviceclient:
      ledger-service:
        base-url: "${account.test.external.base-url}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      billing-service:
        base-url: "${account.test.external.base-url}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

# paytech-messaging 消费端：account.billing.hash 与 account.billing.p0..p3；重投退避缩短到 200ms。
messaging:
  consumer:
    service: account
    retry-backoff: 200ms
  consumers:
    billing:
      partitions: 4

# paytech-compensation-event：本库 t_compensation_event（现行模型）；account 目前没有补偿 Handler，扫描空表验证装配。
compensation:
  enabled: true
  instance-id: account-test

# paytech-xxl-job-starter（随 compensation-event 引入）：测试不连接调度中心，日终核对由用例直接调用 Job Handler。
xxl:
  job:
    executor:
      enabled: false

management:
  server:
    # 独立管理端口；测试随机分配，由 @LocalManagementPort 读取。
    address: 127.0.0.1
    port: 0
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

# ==================== Account 系统自定义配置 ====================

account:
  identifier:
    # Snowflake Region / Worker 标识；生产无默认值且必填，修改需重启。测试进程固定 0/0。
    region-id: 0
    worker-id: 0
  test:
    external:
      # 测试专用运行时字段；EnableMockHttpServer 在创建真实客户端之前注入 Loopback 随机端口。
      base-url: ""
