server:
  address: 127.0.0.1
  port: 18114

spring:
  application:
    name: account-service
  jmx:
    enabled: false
  datasource:
    # 第 11b 步起连接自有库 mor_account（design/04 §3.2），account_app 只有本库 DML 权限。
    url: "${ACCOUNT_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_account?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${ACCOUNT_DB_USERNAME:account_app}"
    password: "${ACCOUNT_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  # BillingFactRecorded 消费与 AccountPosted 发布：发布确认与不可路由退回，AccountPostedHandler 等待 Broker 确认后才算发布成功。
  rabbitmq:
    host: "${ACCOUNT_RABBITMQ_HOST:127.0.0.1}"
    port: "${ACCOUNT_RABBITMQ_PORT:5672}"
    username: "${ACCOUNT_RABBITMQ_USERNAME:}"
    password: "${ACCOUNT_RABBITMQ_PASSWORD:}"
    virtual-host: "${ACCOUNT_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

# paytech-messaging：消费端按 Handler 声明 account.billing.hash 与分区队列 account.billing.p0..p3；发布端声明 account.events（design/08 §3）。
messaging:
  consumer:
    service: account
  consumers:
    billing:
      partitions: 4
  producer:
    service: account
    # 发布侧按聚合串行（design/08 §3）：同一过账流的 ACCOUNT_POSTED 补偿任务在固定线程按 Claim 顺序发布，减少 ledger 的序号缺口重投。
    sequencer:
      enabled: true
  publisher:
    # 订阅方 ledger 与本次改造同时接入 AccountPosted：未路由视为发布失败，由补偿任务重试。
    unroutable-policy: FAIL

# paytech-compensation-event：入账事务内登记 ACCOUNT_POSTED 发布任务，提交后执行；XXL-Job 执行器同时承载兜底扫描与到期转可用任务
# accountBalanceMaturity，调度中心地址与执行器参数沿用组件默认，由部署注入。
compensation:
  enabled: true
  # 多实例 Claim/Lease 的实例标识前缀：account；部署多实例时由 ACCOUNT_COMPENSATION_INSTANCE_ID 注入带实例后缀的值。
  instance-id: "${ACCOUNT_COMPENSATION_INSTANCE_ID:account}"

# 实例 ID（实例清单 instance.id，01 §5）：领域事件信封 instanceId。
paytech:
  instance-id: "${PAYTECH_INSTANCE_ID:main}"

management:
  server:
    # 管理端口 = 业务端口 + 1000（01 §3）。
    address: 127.0.0.1
    port: 19114
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

account:
  event:
    # AccountPosted 信封身份：sourceService 与 messaging.producer.service 一致。
    source-service: account
    instance-id: "${paytech.instance-id}"
  identifier:
    # 部署分配的 Snowflake Region / Worker 标识，必填；每个 app 独立分配。
    region-id: "${ACCOUNT_SNOWFLAKE_REGION_ID}"
    worker-id: "${ACCOUNT_SNOWFLAKE_WORKER_ID}"
