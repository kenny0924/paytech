server:
  address: 127.0.0.1
  port: 18113

spring:
  application:
    name: billing-service
  jmx:
    enabled: false
  datasource:
    url: "${BILLING_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_billing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${BILLING_DB_USERNAME:billing_app}"
    password: "${BILLING_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      host: "${BILLING_REDIS_HOST:127.0.0.1}"
      port: "${BILLING_REDIS_PORT:16379}"
      password: "${BILLING_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: "${BILLING_RABBITMQ_HOST:127.0.0.1}"
    port: "${BILLING_RABBITMQ_PORT:5672}"
    username: "${BILLING_RABBITMQ_USERNAME:}"
    password: "${BILLING_RABBITMQ_PASSWORD:}"
    virtual-host: "${BILLING_RABBITMQ_VHOST:/mor-local}"
    connection-timeout: 2s
    # 发布确认与不可路由退回：BillingFactRecorded 补偿 Handler 等待 Broker 确认后才算发布成功。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  # 内部 HTTP 客户端：commercial、channel-connector、reconciliation、ledger（自动 PAYMENT 事实登记前事务外读取，技术方案 4.5）。
  # JDK HttpClient 不自动重试；不接服务发现，基址直接配置。platform-support 币种规则由参考数据客户端自建出站客户端读取，
  # 见 platform-support.reference-data.client。
  http:
    clients:
      imperative:
        factory: jdk
    serviceclient:
      commercial-service:
        base-url: "${BILLING_COMMERCIAL_SERVICE_URL:http://127.0.0.1:18108}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      channel-connector-service:
        base-url: "${BILLING_CHANNEL_CONNECTOR_SERVICE_URL:http://127.0.0.1:18110}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      reconciliation-service:
        base-url: "${BILLING_RECONCILIATION_SERVICE_URL:http://127.0.0.1:18115}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow
      ledger-service:
        base-url: "${BILLING_LEDGER_SERVICE_URL:http://127.0.0.1:18105}"
        connect-timeout: 2s
        read-timeout: 5s
        redirects: dont-follow

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

# paytech-redis-starter：计费事实的提交、批准使用 AbstractLockProcessor 资源锁。
redis:
  coordination:
    enabled: true

# paytech-compensation-event：计费事实批准事务内登记 BILLING_FACT_RECORDED 发布任务，提交后执行；XXL-Job 兜底唤醒沿用组件默认。
compensation:
  enabled: true
  # 多实例 Claim/Lease 的实例标识前缀：billing；部署多实例时由 BILLING_COMPENSATION_INSTANCE_ID 注入带实例后缀的值。
  instance-id: "${BILLING_COMPENSATION_INSTANCE_ID:billing}"

# paytech-messaging 发布端：声明 billing.events（Durable Fanout）并提供 DomainEventPublisher（design/08 §3）。
# 消费端：订阅 acquiring 的 OrderPaymentSucceeded（技术方案 4.3，S13），声明 billing.acquiring.hash 与 billing.acquiring.p0..p3 分区队列
# （含 DLX/DLQ），登记自动 PAYMENT 事实。
messaging:
  producer:
    service: billing
  publisher:
    unroutable-policy: FAIL
  consumer:
    service: billing
  consumers:
    acquiring:
      partitions: 4

# 实例 ID（实例清单 instance.id，01 §5）：领域事件信封 instanceId。
paytech:
  instance-id: "${PAYTECH_INSTANCE_ID:main}"

# paytech-platform-support-reference-data-client：Platform 币种规则进程内全量快照。启动后立即加载（不阻塞启动），首次成功前按
# initial-retry-interval（默认 PT10S）重试，之后按 refresh-interval（默认 PT1H）全量刷新；刷新失败保留上一份快照。读方法只读内存，
# 可在登记事务内使用；查不到币种不提前回源。
platform-support:
  reference-data:
    client:
      # 直连 Platform 基址（含 Context Path /platform-support），不走服务发现；X-Caller-Service 取 spring.application.name。
      base-url: "${BILLING_PLATFORM_SERVICE_URL:http://127.0.0.1:18106/platform-support}"
      kinds: [CURRENCY]

management:
  server:
    # 管理端口 = 业务端口 + 1000（01 §3）。
    address: 127.0.0.1
    port: 19113
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          # referenceData：首次成功加载 Platform 币种快照前为 OUT_OF_SERVICE（Q3）。
          include: readinessState,referenceData
    info:
      access: read-only
    prometheus:
      access: read-only

billing:
  event:
    # BillingFactRecorded 信封身份：sourceService 与 messaging.producer.service 一致。
    source-service: billing
    instance-id: "${paytech.instance-id}"
  identifier:
    # 部署分配的 Snowflake Region / Worker 标识，必填；每个 app 独立分配。
    region-id: "${BILLING_SNOWFLAKE_REGION_ID}"
    worker-id: "${BILLING_SNOWFLAKE_WORKER_ID}"
