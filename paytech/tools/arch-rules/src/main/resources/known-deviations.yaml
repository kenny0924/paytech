# 已登记的既有偏差（规则库不做豁免，规则仍如实报告）。
# 服务 ArchitectureAutoTest 与 Reactor 依赖图测试要求：实际违规减去本清单为空；本清单中属于被检查范围的条目必须仍然出现，
# 偏差消除后必须删除对应条目。新增条目须写明原因并在任务报告中登记待确认。
deviations:
  # 第 02a 步：Platform api 的 DTO 使用 Jackson 注解与 JsonNode，ApiCredentialValidationApi 为 Gateway 提供 Mono 签名；
  # 去除会改变已发布合同，是否放宽 R2 允许清单待评审。
  - rule: R2
    subject: com.paytech:paytech-platform-support-api
    message: "api 模块存在不允许的依赖: io.projectreactor:reactor-core (compile)"
  - rule: R2
    subject: com.paytech:paytech-platform-support-api
    message: "api 模块存在不允许的依赖: com.fasterxml.jackson.core:jackson-annotations (compile)"
  - rule: R2
    subject: com.paytech:paytech-platform-support-api
    message: "api 模块存在不允许的依赖: tools.jackson.core:jackson-databind (compile)"
  # 2026-10-20 统一对外渠道出口第一段：外部 API 管理合同（externalapi/*）的 DTO 自 platform-support-api 原样迁入 channel-connector-api，
  # 沿用 Jackson 注解与 JsonNode；去除会改变已发布合同，与 Platform 同口径待评审 R2 允许清单。
  - rule: R2
    subject: com.paytech:paytech-channel-connector-api
    message: "api 模块存在不允许的依赖: com.fasterxml.jackson.core:jackson-annotations (compile)"
  - rule: R2
    subject: com.paytech:paytech-channel-connector-api
    message: "api 模块存在不允许的依赖: tools.jackson.core:jackson-databind (compile)"
  # 第 03 步：acquiring / counterparty 的 Client API 线上 DTO 沿用 Commerce 合同的 Jackson 注解（isRequired、NON_NULL、ignoreUnknown），
  # acquiring-api 的 CreateCheckout / CreateRefund 请求体另用 jackson-databind 做严格绑定；去除会改变已发布合同，与 Platform 同口径待评审 R2 允许清单。
  - rule: R2
    subject: com.paytech:paytech-acquiring-api
    message: "api 模块存在不允许的依赖: com.fasterxml.jackson.core:jackson-annotations (compile)"
  - rule: R2
    subject: com.paytech:paytech-acquiring-api
    message: "api 模块存在不允许的依赖: tools.jackson.core:jackson-databind (compile)"
  - rule: R2
    subject: com.paytech:paytech-counterparty-api
    message: "api 模块存在不允许的依赖: com.fasterxml.jackson.core:jackson-annotations (compile)"
