# CDC 白名单：数据服务（D25 / D35）的公开契约。
#
# - 进入白名单 = 允许该表的 MySQL DML 经 Flink CDC 同步到数仓（Doris 库 mor_data_service）。
# - 含 PII 的列必须登记在 maskedColumns（同步前屏蔽）；不得进入数仓的列登记在 excludedColumns。
# - 未列出的表不得同步：任何 Flink CDC pipeline 文件只能引用本文件中的表。
# - 结构：services: [{service, database, tables: [{name, maskedColumns: [], excludedColumns: []}]}]；
#   由 paytech-data-service-core 的 WhitelistCatalog 在启动时校验（表名唯一、列名非空、库名以 mor_ 开头）。
#
# 阶段 0 只登记演示表一张。t_currency_spec 现仍在 Finance 库 mor_finance；
# 第 07 步后它归 Platform（mor_platform），届时同步修改本条与 local-environment/flink/pipelines/demo-currency-spec.yaml。
services:
  - service: ledger
    database: mor_finance
    tables:
      - name: t_currency_spec
        maskedColumns: []
        excludedColumns: []
