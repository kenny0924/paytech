server:
  port: 18120

spring:
  application:
    name: data-service
  jmx:
    enabled: false

management:
  server:
    port: 19120
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: always
      probes:
        enabled: true

data-service:
  cdc:
    # 公开白名单契约，构建期从 paytech/data-service/cdc/whitelist.yaml 打包进 core。
    whitelist-location: classpath:cdc/whitelist.yaml
  doris:
    # 关闭时不创建 Doris DataSource，也不注册 doris 健康指示器；mock Profile 关闭。
    enabled: true
    # Doris FE 的 MySQL 协议查询端口；本地 analytics Profile 映射到 127.0.0.1:19030。
    url: "${DATA_SERVICE_DORIS_URL:jdbc:mysql://127.0.0.1:19030/mor_data_service?useSSL=false&connectTimeout=2000&socketTimeout=5000}"
    username: "${DATA_SERVICE_DORIS_USERNAME:data_service_app}"
    # 无默认值：本地取 local-environment/.env.local 的 MOR_DATA_SERVICE_DORIS_PASSWORD，缺失时启动失败。
    password: "${MOR_DATA_SERVICE_DORIS_PASSWORD}"
    connect-timeout: 2s
