# 真实 Doris 联调配置（manual，默认构建不执行）；Doris 来自 local-environment 的 analytics Profile。

server:
  port: 0

spring:
  application:
    name: data-service
  jmx:
    enabled: false

management:
  server:
    port: 0
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: always

data-service:
  cdc:
    whitelist-location: classpath:cdc/whitelist.yaml
  doris:
    enabled: true
    url: "jdbc:mysql://127.0.0.1:19030/mor_data_service?useSSL=false&connectTimeout=2000&socketTimeout=5000"
    username: data_service_app
    # 由开发者在终端导出，测试不读取 .env.local。
    password: "${MOR_DATA_SERVICE_DORIS_PASSWORD}"
    connect-timeout: 2s
