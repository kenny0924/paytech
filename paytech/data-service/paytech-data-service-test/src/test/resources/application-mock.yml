# data-service 的 Mock 测试配置，同时是本服务配置字段清单（UNIT_TEST_GUIDE 第 12 节）。
# 阶段 0 无数据库、Redis、MQ 与外部 HTTP 依赖；Doris 关闭。

server:
  # RANDOM_PORT 测试注入随机端口。
  port: 0

spring:
  application:
    name: data-service
  jmx:
    enabled: false

management:
  server:
    # 随机管理端口，由 @LocalManagementPort 读取。
    port: 0
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: always
      probes:
        enabled: true

data-service:
  cdc:
    # 与正式应用相同：读取 core 打包的公开白名单契约，测试不另备副本。
    whitelist-location: classpath:cdc/whitelist.yaml
  doris:
    # Mock 关闭 Doris：不创建 DataSource 与 doris 健康指示器；以下字段保留键名但不使用。
    enabled: false
    url: ""
    username: ""
    password: ""
    connect-timeout: 2s
