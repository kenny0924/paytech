server:
  address: 127.0.0.1
  port: 18105

spring:
  application:
    name: finance-service
  jmx:
    enabled: false
  datasource:
    url: "${FINANCE_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${FINANCE_DB_USERNAME:finance_app}"
    password: "${FINANCE_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
