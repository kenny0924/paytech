server:
  address: 127.0.0.1
  port: 18105

spring:
  application:
    name: finance-service
  jmx:
    enabled: false
  datasource:
    url: "${FINANCE_DB_URL:jdbc:mysql://127.0.0.1:13306/mor_finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${FINANCE_DB_USERNAME:finance_app}"
    password: "${FINANCE_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      host: "${FINANCE_REDIS_HOST:127.0.0.1}"
      port: "${FINANCE_REDIS_PORT:16379}"
      password: "${FINANCE_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

# paytech-redis-starter：人工调整复核与期间创建的资源锁使用 AbstractLockProcessor。
redis:
  coordination:
    enabled: true

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only

finance:
  identifier:
    # 部署分配的 Snowflake Region / Worker 标识，必填。
    region-id: "${FINANCE_SNOWFLAKE_REGION_ID}"
    worker-id: "${FINANCE_SNOWFLAKE_WORKER_ID}"
