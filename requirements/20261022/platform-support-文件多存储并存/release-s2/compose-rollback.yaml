      PLATFORM_SUPPORT_INTERNAL_AUTH_MODE: !reset null
      PAYTECH_INSTANCE_ID: !reset null
      FILES_ONBOARDING_ENABLED: "true"
      DATAQUERY_HTTP_CALLERS_0: operations-console-bff
