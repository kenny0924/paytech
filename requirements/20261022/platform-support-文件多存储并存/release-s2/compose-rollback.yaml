# 文件多存储并存第二段：mor-test 回滚覆盖文件（2026-10-22 阶段 6 读取的运行镜像与环境变量）。
# 用法同 compose-candidate.yaml，只传本文件。前提：CCT 第 2 步与 Platform 删 Owner 的 DDL 都还没有执行（release.md 第 6 节）。
# Platform 环境回到工作流发布的覆盖文件（与现网逐键相同）：去掉 DUAL 与 PAYTECH_INSTANCE_ID，加回 FILES_ONBOARDING_ENABLED。
# client-console-bff 的现网镜像 51f5263b 已不在本机 Docker（2026-10-22 磁盘事故后被清理）：用 e119cbd1 重新构建的
#   2ff7bff9 代替，其 JAR 与现网容器内 JAR 逐条目比较 0 差异（release.md 第 1.2 节）。
# client-master、client-console-bff、client-console-web 现网用 :development tag，回滚改钉 sha256，避免 tag 已被他人重建。
services:
  platform-support-service:
    image: sha256:b9301714dfda42217fda8d2e5e80e45df02ec89f4feb2a4f19d187ae48a63b40  # mor-test/platform-support-service:wf-20261022a（JAR 53c0903f2d0ab3c9）
