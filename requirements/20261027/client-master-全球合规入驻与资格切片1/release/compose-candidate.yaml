# 全球合规入驻与资格切片 1：mor-test 合并候选覆盖（P-2，rel-build 2026-10-27）。= 6 个 compose-candidate.<service>.yaml + channel-connector 草稿。
# 用法见 runbook 第 1 节 up()：一次只起一个服务，--no-deps --no-build --pull never；不加 --remove-orphans。
# 构建源与核对：../verification/rel-build-report.md（源快照 Code-MoR-onboard-rel，指纹 6f985f45736395e6）。
# screening-mock 不在此文件：test-environment/compose.screening-mock.yaml（Code-MoR-onboard worktree，SCREENING_MOCK_SCRIPT 见 P-9）。
services:
  client-master-service:
    # 全球入驻：Schema 驱动申请、证件 Token 化（Vault LEGAL_IDENTIFIER_V1）、ClientReviewDecided v1 + v2、入驻码、国家包；
    # 移除 form-options。需先执行 Vault DML 与 client-master DDL / 回填 / 清理（runbook ①—⑤）。
    image: sha256:0af5b79239ef791cf17400fc6f479ec21089a65d9c03af6dd2c1068f915bec33  # mor-test/client-master-service:onboard-20261027a（JAR f6bc8f3b4031976e）
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.30.73.26
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mor_client_master?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: client_master_app
      SPRING_DATASOURCE_PASSWORD: ${MOR_CLIENT_MASTER_DB_PASSWORD:?prepare test secrets}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${PAYTECH_REDIS_PASSWORD:?prepare test secrets}
      CCT_RABBITMQ_HOST: rabbitmq
      CCT_RABBITMQ_PORT: "5672"
      CCT_RABBITMQ_USERNAME: ${MOR_RABBITMQ_USER:?prepare test secrets}
      CCT_RABBITMQ_PASSWORD: ${MOR_RABBITMQ_PASSWORD:?prepare test secrets}
      CCT_RABBITMQ_VHOST: /mor-test
      MESSAGING_CONSUMER_SERVICE: client-master
      MESSAGING_CONSUMERS_COMPLIANCE_PARTITIONS: "4"
      ONBOARDING_DRAFT_ENABLED: "true"
      ONBOARDING_RECOVERY_ENABLED: "true"
      ONBOARDING_ID_DATACENTER: "0"
      ONBOARDING_ID_WORKER: "26"
      COMPENSATION_INSTANCE_ID: client-master-test
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      XXL_JOB_ADMIN_ACCESSTOKEN: ${MOR_XXL_JOB_ACCESS_TOKEN:?prepare test secrets}
      XXL_JOB_EXECUTOR_ENABLED: "true"
      XXL_JOB_EXECUTOR_APPNAME: client-master-service
      XXL_JOB_EXECUTOR_IP: 172.30.73.26
      XXL_JOB_EXECUTOR_PORT: "9999"
      XXL_JOB_EXECUTOR_LOGPATH: /tmp/xxl-job
      XXL_JOB_EXECUTOR_EXCLUDEDPACKAGES: org.springframework.,spring.
  compliance-service:
    # 程序解析 /compliance/v1/programs/resolve、筛查（经 channel-connector S_SCREENING_MOCK）、运营工作台、CRR / 推荐 / 四眼决定、
    # ClientReviewDecided v2、逾期任务。需先执行 compliance DDL / DML / 清理（runbook ⑦）。
    # P-3：保留 ONBOARDING_REVIEW_ENABLED=true；删除 ONBOARDING_MATERIALS_ENABLED（onboarding.materials.* 已移除，!reset 去掉主 compose 的键）；
    #   COMPLIANCE_SCREENING_CHANNEL_CODE 不设（缺省 S_SCREENING_MOCK）；出站经服务发现，无新增地址键。
    image: sha256:f5a9b13a0f0551d407f87e9efba138a45faafd7b37556b6d75f8a2a5f40a1b81  # mor-test/compliance-service:onboard-20261027a（JAR 2264afa0d7d4b60c）
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.30.73.32
      COMPLIANCE_DB_URL: jdbc:mysql://mysql:3306/mor_compliance?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      COMPLIANCE_DB_USERNAME: compliance_app
      COMPLIANCE_DB_PASSWORD: ${MOR_COMPLIANCE_DB_PASSWORD:?prepare test secrets}
      COMPLIANCE_RABBITMQ_HOST: rabbitmq
      COMPLIANCE_RABBITMQ_PORT: "5672"
      COMPLIANCE_RABBITMQ_USERNAME: ${MOR_RABBITMQ_USER:?prepare test secrets}
      COMPLIANCE_RABBITMQ_PASSWORD: ${MOR_RABBITMQ_PASSWORD:?prepare test secrets}
      COMPLIANCE_RABBITMQ_VHOST: /mor-test
      COMPLIANCE_SNOWFLAKE_REGION_ID: "0"
      COMPLIANCE_SNOWFLAKE_WORKER_ID: "29"
      ONBOARDING_REVIEW_ENABLED: "true"
      ONBOARDING_MATERIALS_ENABLED: !reset null
      MESSAGING_PRODUCER_SERVICE: compliance
      MESSAGING_PRODUCER_SEQUENCER_ENABLED: "true"
      MESSAGING_PUBLISHER_UNROUTABLEPOLICY: FAIL
      COMPENSATION_INSTANCEID: compliance-test
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      XXL_JOB_ADMIN_ACCESSTOKEN: ${MOR_XXL_JOB_ACCESS_TOKEN:?prepare test secrets}
      XXL_JOB_EXECUTOR_ENABLED: "true"
      XXL_JOB_EXECUTOR_APPNAME: compliance-service
      XXL_JOB_EXECUTOR_IP: 172.30.73.32
      XXL_JOB_EXECUTOR_PORT: "9999"
      XXL_JOB_EXECUTOR_LOGPATH: /tmp/xxl-job
      XXL_JOB_EXECUTOR_EXCLUDEDPACKAGES: org.springframework.,spring.
  client-console-bff:
    # Schema 驱动入驻转发（程序解析、申请、证件掩码、声明、提交、撤回、审核结果）；移除 form-options 转发。
    # 另随 ea0272f3 带上现网镜像（i18n-20261023a）之后已提交的 client-master-api / compliance-api / platform-support-api 合同库变化（报告第 1 节）。
    image: sha256:83386ff51561cb26311571a7c952e39a762da3a1266c6fd477bd0b30c24323d4  # mor-test/client-console-bff:onboard-20261027a（JAR dcd2ccad2803037f）
    environment:
      CLIENT_BFF_BIND_ADDRESS: 172.30.73.27
      CLIENT_ONBOARDING_ENABLED: "true"
      CLIENT_CONSOLE_ORIGIN: https://localhost:28443
  operations-console-bff:
    # 入驻配置 / 入驻码 / Client 三页与审核工作台新按钮的转发（client-master-service / compliance-service 经 Nacos）。
    # 4 个 OPERATIONS_*_BASE_URL 必带（2026-10-21 漏带 RECONCILIATION 致对账页 503）。
    image: sha256:c5ed58df68333390bc7c99eedf737e73d4e54d9c02bcd6da54d58089cb332f44  # mor-test/operations-console-bff:onboard-20261027a（JAR 895edb6ac1e44e1f）
    environment:
      OPERATIONS_BFF_BIND_ADDRESS: 172.30.73.22
      OPERATIONS_CONSOLE_ORIGIN: http://localhost:28080
      OPERATIONS_TEST_HTTP_ENABLED: "true"
      OPERATIONS_LEDGER_BASE_URL: http://ledger-service:18105
      OPERATIONS_ACCOUNT_BASE_URL: http://account-service:18114
      OPERATIONS_BILLING_BASE_URL: http://billing-service:18113
      OPERATIONS_RECONCILIATION_BASE_URL: http://reconciliation-service:18115
  client-console-web:
    # Schema 驱动入驻页（onboarding-schema 命名空间）；旧入驻页 onboarding.* 移除。nginx 镜像，env 只有镜像自带 ACME_VERSION。
    image: sha256:34d3d6e303fd7f62fa7da825599391a2f34ba569e4bbf92a8839d5859a133998  # mor-test/client-console-web:onboard-20261027a（dist 11 个文件）
  operations-console-web:
    # 入驻配置、入驻码、Client 三页与审核工作台（筛查 / 推荐 / 豁免 / 四眼决定）。现网 relsnap-20261025a dist 与 ea0272f3 构建逐字节相同，不回退他人工作。
    image: sha256:88ab111a7fdabeea6893c307f36a32baec8082b74b218fc2400f12b2cd031872  # mor-test/operations-console-web:onboard-20261027a（dist 234 个文件）
  channel-connector-service:
    image: sha256:23679d451fe44dfce08426777b5ec7cbc73a60253c604f149dfc48291c3890aa  # mor-test/channel-connector-service:card3ds-20261022（JAR 9cb23e8161abc430），本切片不改代码
    environment:
      CHANNEL_CONNECTOR_RABBITMQ_HOST: rabbitmq
      CHANNEL_CONNECTOR_RABBITMQ_PORT: "5672"
      CHANNEL_CONNECTOR_RABBITMQ_USERNAME: ${MOR_RABBITMQ_USER:?prepare test secrets}
      CHANNEL_CONNECTOR_RABBITMQ_PASSWORD: ${MOR_RABBITMQ_PASSWORD:?prepare test secrets}
      CHANNEL_CONNECTOR_RABBITMQ_VHOST: /mor-test
      CHANNELCONNECTOR_PROTOCOL_EXECUTION_ALLOWEDSCHEMES: "https,http"
      CHANNELCONNECTOR_PROTOCOL_EXECUTION_TRUSTEDNETWORKS: "172.30.73.43/32"
    depends_on:
      rabbitmq: { condition: service_healthy }
  platform-support-service:
    image: sha256:cad6dc14cc7c2c7687cc7aacdaf0a77804e529c6f492adacab56ba1045659ba2  # mor-test/platform-support-service:onboard-20261027a（JAR 478c53dea4ac7f92）
