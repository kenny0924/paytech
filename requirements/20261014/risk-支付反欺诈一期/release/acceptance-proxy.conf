# 验收期临时代理：只在验收窗口运行，宿主机 127.0.0.1:28114 → mor-test 后端网络内的 risk-service:18104。
# 用本地已有镜像 nginx:1.30.4-alpine 运行一个不属于 Compose 项目的容器，验收结束即删除；不改 test Nginx/Gateway。
events {}
http {
  server {
    listen 8080;
    client_max_body_size 1m;
    location / {
      proxy_pass http://172.30.73.25:18104;
      proxy_set_header Host risk-service;
    }
  }
}
