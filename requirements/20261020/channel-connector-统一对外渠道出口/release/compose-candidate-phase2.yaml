      DATAQUERY_HTTP_CALLERS_0: operations-console-bff
      PLATFORM_SUPPORT_FILES_ENABLED: "true"
      FILES_ONBOARDING_STORAGE_PROVIDER: !reset null
      FILES_ONBOARDING_STORAGE_CONTAINER_REF: !reset null
      FILES_ONBOARDING_SCAN_POLICY_CODE: !reset null
      FILES_ONBOARDING_MINIO_ENDPOINT: !reset null
      FILES_ONBOARDING_MINIO_REGION: !reset null
      FILES_ONBOARDING_MINIO_ACCESS_KEY: !reset null
      FILES_ONBOARDING_MINIO_SECRET_KEY: !reset null
      FILES_ONBOARDING_MINIO_TRUSTED_CERTIFICATE: !reset null
      PLATFORM_SUPPORT_RABBITMQ_HOST: !reset null
      PLATFORM_SUPPORT_RABBITMQ_PORT: !reset null
      PLATFORM_SUPPORT_RABBITMQ_USERNAME: !reset null
      PLATFORM_SUPPORT_RABBITMQ_PASSWORD: !reset null
      PLATFORM_SUPPORT_RABBITMQ_VHOST: !reset null
  operations-console-bff:
    # /data-query-admin/v1、/data-query/v1 18 条转发（metadata-only 日志），PlatformClientConfiguration 登记 3 个数据查询 Api。
    image: sha256:0abb662a764aa2af09f7dec546396b616f81fe7d8b56ebacc5434e3aa5a6e65f  # mor-test/operations-console-bff:ccu2-20261022（JAR 9b3aec5bda70）
  operations-console-web:
    # 数据查询 → 数据源 / 查询模板；CodeMirror 6 懒加载。基线 = 文件多存储并存 d58172d9（163 个文件逐字节一致）。
    # 第二版：验收修正——新建模板默认超时 5 秒、上限提示 8 秒 / 48 KB，新建数据源后选中新建项（首版 e29197ba）。
    # 第二版：缺陷 D-3 修正——渠道详情不再对授权列表 / 实现列表同时发 3 个请求（Gateway 每人并发 2）。首版 fb29b533。
    image: sha256:9eaa85211107a08bc1f4825517ec167444643e8f923363627d344978599cd9bc  # mor-test/operations-console-web:ccu2-20261022b
