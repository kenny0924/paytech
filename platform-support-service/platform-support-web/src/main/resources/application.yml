server:
  port: 18106
  servlet:
    context-path: /platform-support

spring:
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 1000
      "[mail.smtp.timeout]": 2000
      "[mail.smtp.writetimeout]": 1000
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
  application:
    name: platform-support-service
  data:
    redis:
      host: "${PLATFORM_SUPPORT_REDIS_HOST:127.0.0.1}"
      port: "${PLATFORM_SUPPORT_REDIS_PORT:16379}"
      password: "${PLATFORM_SUPPORT_REDIS_PASSWORD:}"
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: "${PLATFORM_SUPPORT_DB_URL}"
    username: "${PLATFORM_SUPPORT_DB_USERNAME}"
    password: "${PLATFORM_SUPPORT_DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        connectTimeout: 2000
        socketTimeout: 2000
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        namespace: "${NACOS_NAMESPACE:mor-local}"
  jmx:
    enabled: false

vault:
  client:
    caller-service: platform-support-service
    connect-timeout: 2s
    read-timeout: 2s

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,gatewaySnapshot
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    redis:
      enabled: "${operations.authentication.enabled:false}"
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Authentication adapters are explicitly development-only; enabling them requires local/auto.
operations:
  audit:
    queue-capacity: 256
  authentication:
    lock-wait-time: 500ms
    lock-lease-time: 30s
    enabled: false

redis:
  coordination:
    enabled: "${operations.authentication.enabled:false}"
    resource-lock:
      wait-time: 500ms
      lease-time: 30s

web:
  logging:
    metadata-only-path-prefixes:
      - /internal/onboarding-files
      - /onboarding-files
      - /review-files
      - /authentication
      - /authorization
      - /operations
      - /gateway-admin
      - /console-admin
      - /permission-admin
      - /api-credential-admin
      - /api-scope-admin
      - /api-credentials
      - /tenant-projections
      - /external-api-admin


client:
  authentication:
    lock-wait-time: 500ms
    lock-lease-time: 30s
    enabled: false

tenant:
  projection:
    enabled: false

# 本地补偿执行默认跟随入驻文件开关；单独启用通知等其他消费者时设置 PLATFORM_SUPPORT_COMPENSATION_ENABLED=true。
# 关闭时不创建补偿 Registrar，通知启用会在启动时因缺少该 Bean 失败；周期扫描的 XXL-Job 调度另行配置。
compensation:
  enabled: ${PLATFORM_SUPPORT_COMPENSATION_ENABLED:${files.onboarding.enabled:false}}

# 外部 API 配置写入共用一把资源锁（lock:external-api-config）；修改需重启。
ps:
  integration:
    configuration:
      lock-wait-time: 500ms
      lock-lease-time: 30s

# Scope create/update share the Foundation Processor lock; timing changes require restart.
api-scope:
  management:
    lock-wait-time: 500ms
    lock-lease-time: 30s

# 普通邮件只开放模块入口；启用时显式开启 compensation.enabled 并配置实际 Provider/Vault。
notification:
  enabled: false
  # worker-id: 独立启用通知时必须显式分配 0..31，不提供生产默认值。
  maximum-send-attempts: 3
  retry-delay: 30s
  # 仅不支持查询的 Provider（如 SES）：结果未知后至少等待该时长才重发，至少 1m。
  unknown-resend-delay: 10m
  # Amazon SES 发送账号；需同时启用 notification.enabled。IAM 用户密钥对保存在 Vault（NOTIFICATION_PROVIDER_CREDENTIAL_V1），
  # 这里只放其 Token，每次发送前以 NOTIFICATION_DELIVERY 用途 Reveal；Token 为空时走 AWS 默认凭据链。
  ses:
    enabled: ${NOTIFICATION_SES_ENABLED:false}
    provider-code: ${NOTIFICATION_SES_PROVIDER_CODE:}
    region: ${NOTIFICATION_SES_REGION:me-central-1}
    from-address: ${NOTIFICATION_SES_FROM_ADDRESS:}
    configuration-set: ${NOTIFICATION_SES_CONFIGURATION_SET:}
    # endpoint: 可选 HTTPS 终端覆盖（如 VPC 终端），默认区域终端。
    credential-token: ${NOTIFICATION_SES_CREDENTIAL_TOKEN:}
    connect-timeout: 2s
    read-timeout: 5s
