server:
  address: ${OPERATIONS_BFF_BIND_ADDRESS:127.0.0.1}
  port: 18201
  forward-headers-strategy: none

spring:
  application:
    name: operations-console-bff
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:mor-local}
        ip: ${OPERATIONS_BFF_BIND_ADDRESS:127.0.0.1}
  jmx:
    enabled: false

logging:
  pattern:
    level: "%5p %kvp"

management:
  server:
    address: 127.0.0.1
    port: 19201
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

vault:
  client:
    # Vault 以 VAULT_ADMIN_CALLERS 只接受 operations-console-bff 的管理请求；业务 VaultClient 本 BFF 不使用。
    admin-enabled: true
    connect-timeout: 2s
    read-timeout: 5s

operations:
  console-origin: ${OPERATIONS_CONSOLE_ORIGIN:https://operations-console.local.test}
  test-http-enabled: ${OPERATIONS_TEST_HTTP_ENABLED:false}

web:
  logging:
    metadata-only-path-prefixes:
      - /auth
      - /authorization
      - /iam
      - /audit
      - /gateway-admin
      - /console-admin
      - /permission-admin
      - /api-credential-admin
      - /api-scope-admin
      - /decision-dictionaries
      - /decision-rule-sets
      - /decision-releases
      - /decision-flows
      - /decision-variables
      - /external-api-admin
      # 审核详情含申请人个人资料，命令含内部理由与客户可见说明，只记元数据。
      - /client-onboarding-admin
      # 人工加/解密请求与响应含原值或 Token，只记元数据。
      - /vault-admin
