server:
  address: ${OPERATIONS_BFF_BIND_ADDRESS:127.0.0.1}
  port: 18201
  forward-headers-strategy: none

spring:
  application:
    name: operations-console-bff
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:mor-local}
        ip: ${OPERATIONS_BFF_BIND_ADDRESS:127.0.0.1}
  jmx:
    enabled: false

logging:
  pattern:
    level: "%5p %kvp"

management:
  server:
    address: 127.0.0.1
    port: 19201
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    info:
      access: read-only
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

operations:
  console-origin: ${OPERATIONS_CONSOLE_ORIGIN:https://operations-console.local.test}
  test-http-enabled: ${OPERATIONS_TEST_HTTP_ENABLED:false}

web:
  logging:
    metadata-only-path-prefixes:
      - /auth
      - /authorization
      - /iam
      - /audit
      - /gateway-admin
      - /console-admin
      - /permission-admin
      - /api-credential-admin
      - /api-scope-admin
      - /decision-dictionaries
      - /decision-rule-sets
      - /decision-releases
      - /decision-flows
      - /decision-variables
      - /external-api-admin
