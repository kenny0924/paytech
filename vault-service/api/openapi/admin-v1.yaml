      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorBadRequest'}
    AccessDenied:
      description: Caller is not an admin caller, or the manual operation is not permitted.
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorAccessDenied'}
    TokenNotFound:
