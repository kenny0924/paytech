      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        Cache-Control: {$ref: '#/components/headers/CacheControlNoStore'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorTokenNotFound'}
    PolicyEntryNotFound:
