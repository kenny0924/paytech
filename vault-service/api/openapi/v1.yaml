openapi: 3.1.0
info:
  title: Vault internal API
  version: 1.0.0
  description: Internal-only API for protecting and revealing approved non-card sensitive values.
paths:
  /vault/v1/records/protect:
    post:
      operationId: protectVaultRecord
      summary: Protect a UTF-8 value and return its opaque Vault Token.
      x-max-raw-body-bytes: 262144
      parameters:
        - $ref: '#/components/parameters/XCallerService'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProtectSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /vault/v1/records/reveal:
    post:
      operationId: revealVaultRecord
      summary: Reveal an approved value for an opaque Vault Token.
      x-max-raw-body-bytes: 262144
      parameters:
        - $ref: '#/components/parameters/XCallerService'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealRequest'
      responses:
        '200':
          $ref: '#/components/responses/RevealSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/TokenNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
components:
  parameters:
    XCallerService:
      name: X-Caller-Service
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z][a-z0-9-]*$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: A single valid value is preserved; missing, repeated, or invalid values are replaced by a server-generated value.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
  headers:
    XRequestId:
      required: true
      description: The effective request correlation ID preserved or generated by Vault.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    CacheControlNoStore:
      required: true
      schema:
        type: string
        enum: [no-store]
    AllowPost:
      required: true
      schema:
        type: string
        enum: [POST]
  schemas:
    ProtectRequest:
      type: object
      additionalProperties: false
      required: [dataType, tokenMode, value, purpose]
      properties:
        dataType:
          $ref: '#/components/schemas/UppercaseCode'
        tokenMode:
          type: string
          enum: [REFERENCE, STABLE]
        value:
          type: string
          description: A UTF-8 string whose encoded byte length is at most 32 KiB.
          x-max-utf8-bytes: 32768
        purpose:
          $ref: '#/components/schemas/UppercaseCode'
    ProtectResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
    RevealRequest:
      type: object
      additionalProperties: false
      required: [token, purpose]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        purpose:
          $ref: '#/components/schemas/UppercaseCode'
    RevealResponse:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [type, title, detail, code, requestId, timestamp]
      properties:
        type:
          type: string
          format: uri-reference
          const: about:blank
        title:
          type: string
          enum:
            - Bad Request
            - Forbidden
            - Not Found
            - Method Not Allowed
            - Conflict
            - Internal Server Error
            - Service Unavailable
        detail:
          type: string
          minLength: 1
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          enum:
            - INVALID_REQUEST
            - VALUE_TOO_LARGE
            - UNSUPPORTED_DATA_TYPE
            - TOKEN_MODE_NOT_ALLOWED
            - ACCESS_DENIED
            - TOKEN_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - IDEMPOTENCY_KEY_CONFLICT
            - INTEGRITY_CHECK_FAILED
            - INTERNAL_ERROR
            - DEPENDENCY_UNAVAILABLE
            - AUDIT_UNAVAILABLE
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        timestamp:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{6}Z$'
    ErrorInvalidRequest:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Bad Request}
            code: {const: INVALID_REQUEST}
            detail: {const: 请求参数无效}
    ErrorValueTooLarge:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Bad Request}
            code: {const: VALUE_TOO_LARGE}
            detail: {const: 值超过32KiB限制}
    ErrorUnsupportedDataType:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Bad Request}
            code: {const: UNSUPPORTED_DATA_TYPE}
            detail: {const: 不支持的数据类型}
    ErrorTokenModeNotAllowed:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Bad Request}
            code: {const: TOKEN_MODE_NOT_ALLOWED}
            detail: {const: Token模式不允许}
    ErrorAccessDenied:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Forbidden}
            code: {const: ACCESS_DENIED}
            detail: {const: 访问被拒绝}
    ErrorTokenNotFound:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Not Found}
            code: {const: TOKEN_NOT_FOUND}
            detail: {const: Token不存在}
    ErrorMethodNotAllowed:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Method Not Allowed}
            code: {const: METHOD_NOT_ALLOWED}
            detail: {const: 请求方法不受支持}
    ErrorIdempotencyConflict:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Conflict}
            code: {const: IDEMPOTENCY_KEY_CONFLICT}
            detail: {const: 幂等键已被不同请求使用}
    ErrorIntegrityCheckFailed:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Internal Server Error}
            code: {const: INTEGRITY_CHECK_FAILED}
            detail: {const: 完整性校验失败}
    ErrorInternal:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Internal Server Error}
            code: {const: INTERNAL_ERROR}
            detail: {const: 服务内部错误}
    ErrorDependencyUnavailable:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Service Unavailable}
            code: {const: DEPENDENCY_UNAVAILABLE}
            detail: {const: 依赖服务暂不可用}
    ErrorAuditUnavailable:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            title: {const: Service Unavailable}
            code: {const: AUDIT_UNAVAILABLE}
            detail: {const: 访问审计不可用}
    ErrorBadRequest:
      oneOf:
        - $ref: '#/components/schemas/ErrorInvalidRequest'
        - $ref: '#/components/schemas/ErrorValueTooLarge'
        - $ref: '#/components/schemas/ErrorUnsupportedDataType'
        - $ref: '#/components/schemas/ErrorTokenModeNotAllowed'
    ErrorInternalFailure:
      oneOf:
        - $ref: '#/components/schemas/ErrorIntegrityCheckFailed'
        - $ref: '#/components/schemas/ErrorInternal'
    ErrorServiceUnavailable:
      oneOf:
        - $ref: '#/components/schemas/ErrorDependencyUnavailable'
        - $ref: '#/components/schemas/ErrorAuditUnavailable'
    UppercaseCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Z][A-Z0-9_]*$'
  responses:
    ProtectSuccess:
      description: Value protected successfully.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProtectResponse'
    RevealSuccess:
      description: Value revealed successfully.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevealResponse'
    BadRequest:
      $ref: '#/components/responses/ErrorBadRequest'
    AccessDenied:
      $ref: '#/components/responses/ErrorAccessDenied'
    TokenNotFound:
      $ref: '#/components/responses/ErrorTokenNotFound'
    MethodNotAllowed:
      $ref: '#/components/responses/ErrorMethodNotAllowed'
    IdempotencyConflict:
      $ref: '#/components/responses/ErrorIdempotencyConflict'
    InternalFailure:
      $ref: '#/components/responses/ErrorInternalFailure'
    DependencyUnavailable:
      $ref: '#/components/responses/ErrorServiceUnavailable'
    ErrorBadRequest:
      description: A stable 400 Vault error response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorBadRequest'
    ErrorAccessDenied:
      description: A stable 403 Vault error response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorAccessDenied'
    ErrorTokenNotFound:
      description: A stable 404 Vault error response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorTokenNotFound'
    ErrorMethodNotAllowed:
      description: A stable 405 Vault error response for a known resource path.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Allow:
          $ref: '#/components/headers/AllowPost'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorMethodNotAllowed'
    ErrorIdempotencyConflict:
      description: A stable 409 Vault error response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorIdempotencyConflict'
    ErrorInternalFailure:
      description: A stable 500 Vault error response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorInternalFailure'
    ErrorServiceUnavailable:
      description: A stable 503 Vault error response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorServiceUnavailable'
