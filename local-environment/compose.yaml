name: mor-local

services:
  mysql:
    profiles: [base]
    image: mysql:8.4.11
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MOR_MYSQL_ROOT_PASSWORD:?copy .env.example to .env.local and set MOR_MYSQL_ROOT_PASSWORD}
      TZ: UTC
      MOR_CCT_DB_PASSWORD: ${MOR_CCT_DB_PASSWORD:?set MOR_CCT_DB_PASSWORD}
      MOR_COMMERCE_DB_PASSWORD: ${MOR_COMMERCE_DB_PASSWORD:?set MOR_COMMERCE_DB_PASSWORD}
      MOR_PAYMENT_DB_PASSWORD: ${MOR_PAYMENT_DB_PASSWORD:?set MOR_PAYMENT_DB_PASSWORD}
      MOR_RISK_DB_PASSWORD: ${MOR_RISK_DB_PASSWORD:?set MOR_RISK_DB_PASSWORD}
      MOR_FINANCE_DB_PASSWORD: ${MOR_FINANCE_DB_PASSWORD:?set MOR_FINANCE_DB_PASSWORD}
      MOR_PLATFORM_DB_PASSWORD: ${MOR_PLATFORM_DB_PASSWORD:?set MOR_PLATFORM_DB_PASSWORD}
      MOR_VAULT_DB_PASSWORD: ${MOR_VAULT_DB_PASSWORD:?set MOR_VAULT_DB_PASSWORD}
      MOR_NACOS_DB_PASSWORD: ${MOR_NACOS_DB_PASSWORD:?set MOR_NACOS_DB_PASSWORD}
      MOR_XXL_JOB_DB_PASSWORD: ${MOR_XXL_JOB_DB_PASSWORD:?set MOR_XXL_JOB_DB_PASSWORD}
      PAYTECH_FOUNDATION_TEST_DB_PASSWORD: ${PAYTECH_FOUNDATION_TEST_DB_PASSWORD:?set PAYTECH_FOUNDATION_TEST_DB_PASSWORD}
      MOR_CDC_DB_PASSWORD: ${MOR_CDC_DB_PASSWORD:?set MOR_CDC_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max-connections=200
      # Row-based binlog with GTID for the analytics profile's Flink CDC source; applies on the next MySQL recreate.
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --server-id=1
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1536m
    networks: [mor]

  redis:
    profiles: [base]
    image: redis:8.2.1-alpine
    restart: "no"
    environment:
      PAYTECH_REDIS_PASSWORD: ${PAYTECH_REDIS_PASSWORD:?set PAYTECH_REDIS_PASSWORD}
      TZ: UTC
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${PAYTECH_REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$${PAYTECH_REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    networks: [mor]

  rabbitmq:
    profiles: [base]
    image: rabbitmq:4.2.9-management
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: ${MOR_RABBITMQ_USER:?set MOR_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MOR_RABBITMQ_PASSWORD:?set MOR_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${MOR_RABBITMQ_VHOST:-/mor-local}
      TZ: UTC
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # paytech-messaging needs the consistent hash exchange (design/08 §3); management and prometheus keep the image defaults.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    networks: [mor]

  nacos:
    profiles: [base]
    image: nacos/nacos-server:v3.1.2-slim
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${MOR_NACOS_DB_PASSWORD:?set MOR_NACOS_DB_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${MOR_NACOS_AUTH_TOKEN:?set MOR_NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${MOR_NACOS_AUTH_IDENTITY_KEY:?set MOR_NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${MOR_NACOS_AUTH_IDENTITY_VALUE:?set MOR_NACOS_AUTH_IDENTITY_VALUE}
      NACOS_CONSOLE_PORT: 8080
      JVM_XMS: 256m
      JVM_XMX: 768m
      JVM_XMN: 128m
      TZ: UTC
    ports:
      - "127.0.0.1:18088:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 1024m
    networks: [mor]

  minio:
    profiles: [storage]
    # 社区版官方镜像已下架；使用 Chainguard 源码构建镜像并按摘要固定（MinIO RELEASE.2026-09-22T19-25-18Z）。
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MOR_MINIO_ROOT_USER:?set MOR_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MOR_MINIO_ROOT_PASSWORD:?set MOR_MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MOR_MINIO_KMS_SECRET_KEY:?set MOR_MINIO_KMS_SECRET_KEY}
      MC_HOST_local: https://${MOR_MINIO_ROOT_USER}:${MOR_MINIO_ROOT_PASSWORD}@127.0.0.1:9000
      # 浏览器按预签名地址直传/下载；只允许本机 Client 与 Operations 站点源。
      MINIO_API_CORS_ALLOW_ORIGIN: ${MOR_MINIO_CORS_ALLOW_ORIGIN:-https://127.0.0.1:18443,https://127.0.0.1:18444}
      TZ: UTC
    command: [server, /data, --certs-dir, /certs, --address, ":9000", --console-address, ":9001"]
    ports:
      - "127.0.0.1:19400:9000"
      - "127.0.0.1:19401:9001"
    volumes:
      - minio-data:/data
      - ./minio/certs:/certs:ro
    healthcheck:
      test: [CMD, mc, ready, local, --insecure]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    networks: [mor]

  minio-init:
    profiles: [storage]
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MOR_MINIO_ROOT_USER:?set MOR_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MOR_MINIO_ROOT_PASSWORD:?set MOR_MINIO_ROOT_PASSWORD}
      PLATFORM_ACCESS_KEY: ${MOR_MINIO_PLATFORM_ACCESS_KEY:?set MOR_MINIO_PLATFORM_ACCESS_KEY}
      PLATFORM_SECRET_KEY: ${MOR_MINIO_PLATFORM_SECRET_KEY:?set MOR_MINIO_PLATFORM_SECRET_KEY}
    entrypoint: [/bin/sh, /init/init.sh]
    volumes:
      - ./minio/init:/init:ro
    networks: [mor]

  mailpit:
    profiles: [mail]
    # 本机收信服务：接住 Platform 发出的验证/重置邮件，不向外投递。
    image: axllent/mailpit@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    restart: "no"
    environment:
      MP_MAX_MESSAGES: "500"
      TZ: UTC
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    mem_limit: 128m
    networks: [mor]

  vault-service:
    # 本机 Vault（profile: vault）。镜像由 vault/build-image.sh 构建；私密值在 vault/private/vault.env（0600，不提交）。
    profiles: [vault]
    image: mor-local/vault-service:development
    build:
      context: ./vault/bin/image
      dockerfile: ../../../../test-environment/vault/Dockerfile
    user: "10001:10001"
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    env_file:
      - path: ./vault/private/vault.env
        required: true
    environment:
      VAULT_RUNTIME_MODE: local
      VAULT_HTTP_ADDRESS: 0.0.0.0:18107
      VAULT_DB_DSN: vault_app:${MOR_VAULT_DB_PASSWORD:?set MOR_VAULT_DB_PASSWORD}@tcp(mysql:3306)/mor_vault?parseTime=true&loc=UTC
      VAULT_ADMIN_CALLERS: operations-console-bff
      VAULT_SNOWFLAKE_DATACENTER_ID: "0"
      VAULT_SNOWFLAKE_WORKER_ID: "7"
      VAULT_NACOS_ENABLED: "true"
      VAULT_NACOS_SERVER_ADDRESS: nacos:8848
      VAULT_NACOS_NAMESPACE: mor-local
      VAULT_NACOS_GROUP: DEFAULT_GROUP
      # 宿主机上的 Java 服务经发布端口访问，故注册回环地址。
      VAULT_NACOS_INSTANCE_IP: 127.0.0.1
      VAULT_NACOS_INSTANCE_PORT: "18107"
      OTEL_TRACES_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: ""
      TZ: UTC
    ports:
      - "127.0.0.1:18107:18107"
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: [CMD, /app/vault-probe]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [mor]

networks:
  mor:
    name: mor-local-network

volumes:
  mysql-data:
    name: mor-local-mysql-data
  redis-data:
    name: mor-local-redis-data
  rabbitmq-data:
    name: mor-local-rabbitmq-data
  minio-data:
    name: mor-local-minio-data
