# Code-MoR local Doris FE (analytics profile). Based on the apache/doris:fe-3.0.8 image default fe.conf.
# Local-only changes: 768 MiB heap instead of 8 GiB, FQDN mode (hostnames on the shared mor network, no static IPs),
# single replica for every OLAP table. Not a production configuration.
CUR_DATE=`date +%Y%m%d-%H%M%S`
LOG_DIR = ${DORIS_HOME}/log
JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xmx768m -Xms384m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$LOG_DIR -Xlog:gc*:$LOG_DIR/fe.gc.log.$CUR_DATE:time,uptime:filecount=2,filesize=20M --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens java.base/jdk.internal.ref=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.xml/com.sun.org.apache.xerces.internal.jaxp=ALL-UNNAMED"

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = -1

sys_log_level = INFO
sys_log_mode = ASYNC
sys_log_roll_num = 3

enable_fqdn_mode = true
force_olap_table_replication_num = 1
