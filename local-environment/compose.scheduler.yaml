services:
  xxl-job-schema-init:
    profiles: [scheduler]
    image: mysql:8.4.11
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MOR_XXL_JOB_DB_PASSWORD:?set MOR_XXL_JOB_DB_PASSWORD}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        expected_tables="'xxl_job_group','xxl_job_registry','xxl_job_info','xxl_job_logglue','xxl_job_log','xxl_job_log_report','xxl_job_lock','xxl_job_user'"
        table_count="$$(mysql -h mysql -u xxl_job -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='xxl_job' AND table_name IN ($$expected_tables)")"
        if [ "$$table_count" = "0" ]; then
          mysql -h mysql -u xxl_job < /schema/03-xxl-job-schema.sql
          mysql -h mysql -u xxl_job < /schema/04-xxl-job-schema-version.sql
        elif [ "$$table_count" = "8" ]; then
          marker_count="$$(mysql -h mysql -u xxl_job -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='xxl_job' AND table_name='xxl_job_schema_version'")"
          if [ "$$marker_count" = "0" ]; then
            mysql -h mysql -u xxl_job < /schema/04-xxl-job-schema-version.sql
          fi
        else
          echo "Incomplete XXL-Job schema: expected 0 or 8 vendor tables, found $$table_count" >&2
          exit 1
        fi
        installed_version="$$(mysql -h mysql -u xxl_job -Nse "SELECT CONCAT(version, ':', source_commit) FROM xxl_job.xxl_job_schema_version")"
        if [ "$$installed_version" != "3.4.2:c2bbb46c9a3af8e2a69246728a452c606240b80e" ]; then
          echo "Unexpected XXL-Job schema version: $$installed_version" >&2
          exit 1
        fi
    volumes:
      - ./mysql/init:/schema:ro
    networks: [mor]

  xxl-job-admin:
    profiles: [scheduler]
    image: xuxueli/xxl-job-admin:3.4.2
    platform: linux/amd64
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      xxl-job-schema-init:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
      LOG_HOME: /data/applogs
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=xxl_job
        --spring.datasource.password=${MOR_XXL_JOB_DB_PASSWORD:?set MOR_XXL_JOB_DB_PASSWORD}
        --xxl.job.accessToken=${MOR_XXL_JOB_ACCESS_TOKEN:?set MOR_XXL_JOB_ACCESS_TOKEN}
        --xxl.job.timeout=3
        --xxl.job.i18n=en
        --xxl.job.logretentiondays=30
        --xxl-sso.token.key=${MOR_XXL_JOB_LOGIN_TOKEN_KEY:?set MOR_XXL_JOB_LOGIN_TOKEN_KEY}
      TZ: UTC
    entrypoint:
      - /bin/sh
      - -ec
      - exec java $${JAVA_OPTS} $${LOG_HOME:+-DLOG_HOME=$${LOG_HOME}} -jar /app.jar $${PARAMS}
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - xxl-job-admin-logs:/data/applogs
    healthcheck:
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 512m
    networks: [mor]

volumes:
  xxl-job-admin-logs:
    name: mor-local-xxl-job-admin-logs
