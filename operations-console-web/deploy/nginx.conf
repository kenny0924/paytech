worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # 入口 Nginx 负责访问日志，静态服务不重复记录浏览器路径或参数。
    access_log off;
    log_not_found off;

    # 非 root 运行时只需要 /tmp 可写，适配 Compose 的只读根目录。
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/operations-console;
        index index.html;
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # API 只由边缘 Nginx 路由，误入静态容器时不得返回 SPA HTML。
        location = /api {
            return 404;
        }

        location ^~ /api/ {
            return 404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files /index.html =404;
        }

        # Vite 内容哈希文件可以长期缓存；不存在的资源仍返回 404。
        location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}[.](?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
