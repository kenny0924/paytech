# JVM 内存分级（requirements/20261018/test-environment-V2部署与数据迁移 阶段 1 调优；容器上限见各服务 mem_limit）：
#   large（Platform、Gateway）：堆 128m–384m、元空间上限 256m，容器 768m；
#   medium（收单、客户主档、风控决策、合规、支付、卡、总账、计费、两个 BFF）：堆 64m–256m、元空间上限 192m，容器 576m；
#   small（商务、消费者、渠道连接、账户、对账、税务）：堆 64m–160m、元空间上限 160m，容器 448m。
# 依据：本机演练 test Profile 空载实测常驻 170–340 MiB、元空间 55–100 MiB；第 14 步全链路实测 153–649 MiB。
# 入口参数写在 entrypoint（与 java/Dockerfile 同形，只改内存参数），不经 JAVA_TOOL_OPTIONS / JDK_JAVA_OPTIONS 导出，健康探针 JVM 不受影响。
x-jvm-large: &jvm-large [java, -Xms128m, -Xmx384m, -XX:MaxMetaspaceSize=256m, -XX:ReservedCodeCacheSize=64m, -Xss512k, -XX:+UseSerialGC, -XX:TieredStopAtLevel=1, -Duser.home=/tmp, -Djava.io.tmpdir=/tmp, -jar, /app/application.jar]
# Platform 常驻接近 768m 上限（阶段 2 实测 704 MiB），单独给 1024m 容器与 512m 堆。
x-jvm-platform: &jvm-platform [java, -Xms128m, -Xmx512m, -XX:MaxMetaspaceSize=256m, -XX:ReservedCodeCacheSize=64m, -Xss512k, -XX:+UseSerialGC, -XX:TieredStopAtLevel=1, -Duser.home=/tmp, -Djava.io.tmpdir=/tmp, -jar, /app/application.jar]
x-jvm-medium: &jvm-medium [java, -Xms64m, -Xmx256m, -XX:MaxMetaspaceSize=192m, -XX:ReservedCodeCacheSize=48m, -Xss512k, -XX:+UseSerialGC, -XX:TieredStopAtLevel=1, -Duser.home=/tmp, -Djava.io.tmpdir=/tmp, -jar, /app/application.jar]
x-jvm-small: &jvm-small [java, -Xms64m, -Xmx160m, -XX:MaxMetaspaceSize=160m, -XX:ReservedCodeCacheSize=48m, -Xss512k, -XX:+UseSerialGC, -XX:TieredStopAtLevel=1, -Duser.home=/tmp, -Djava.io.tmpdir=/tmp, -jar, /app/application.jar]

x-java: &java
  profiles: [applications]
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  mem_limit: 768m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s

x-discovery: &discovery
  SPRING_PROFILES_ACTIVE: test
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: mor-test
  SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: mor-test-services
  SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${MOR_NACOS_SERVICE_PASSWORD:?prepare test secrets}
  SPRING_CLOUD_NACOS_DISCOVERY_GROUP: DEFAULT_GROUP
  TZ: UTC

services:
  vault-service:
    profiles: [applications]
    image: mor-test/vault-service:development
    build:
      context: ./artifacts/vault
      dockerfile: ../../vault/Dockerfile
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    env_file:
      - path: ./private/vault.env
        required: false
    environment:
      VAULT_RUNTIME_MODE: test
      VAULT_HTTP_ADDRESS: 0.0.0.0:18107
      VAULT_DB_DSN: vault_app:${MOR_VAULT_DB_PASSWORD:?prepare test secrets}@tcp(mysql:3306)/mor_vault?parseTime=true&loc=UTC
      VAULT_ADMIN_CALLERS: operations-console-bff
      VAULT_SNOWFLAKE_DATACENTER_ID: "0"
      VAULT_SNOWFLAKE_WORKER_ID: "24"
      VAULT_NACOS_ENABLED: "true"
      VAULT_NACOS_SERVER_ADDRESS: nacos:8848
      VAULT_NACOS_NAMESPACE: mor-test
      VAULT_NACOS_GROUP: DEFAULT_GROUP
      VAULT_NACOS_INSTANCE_IP: 172.30.73.24
      VAULT_NACOS_INSTANCE_PORT: "18107"
      VAULT_NACOS_USERNAME: mor-test-services
      VAULT_NACOS_PASSWORD: ${MOR_NACOS_SERVICE_PASSWORD:?prepare test secrets}
      OTEL_TRACES_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: ""
      TZ: UTC
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: [CMD, /app/vault-probe]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      backend: { ipv4_address: 172.30.73.24 }

