x-java: &java
  profiles: [applications]
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  mem_limit: 768m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s

x-discovery: &discovery
  SPRING_PROFILES_ACTIVE: test
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: mor-test
  SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: mor-test-services
  SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${MOR_NACOS_SERVICE_PASSWORD:?prepare test secrets}
  SPRING_CLOUD_NACOS_DISCOVERY_GROUP: DEFAULT_GROUP
  TZ: UTC

services:
  vault-service:
    profiles: [applications]
    image: mor-test/vault-service:development
    build:
      context: ./artifacts/vault
      dockerfile: ../../vault/Dockerfile
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    env_file:
      - path: ./private/vault.env
        required: false
    environment:
      VAULT_RUNTIME_MODE: test
      VAULT_HTTP_ADDRESS: 0.0.0.0:18107
      VAULT_DB_DSN: vault_app:${MOR_VAULT_DB_PASSWORD:?prepare test secrets}@tcp(mysql:3306)/mor_vault?parseTime=true&loc=UTC
      VAULT_ADMIN_CALLERS: operations-console-bff
      VAULT_SNOWFLAKE_DATACENTER_ID: "0"
      VAULT_SNOWFLAKE_WORKER_ID: "24"
      VAULT_NACOS_ENABLED: "true"
      VAULT_NACOS_SERVER_ADDRESS: nacos:8848
      VAULT_NACOS_NAMESPACE: mor-test
      VAULT_NACOS_GROUP: DEFAULT_GROUP
      VAULT_NACOS_INSTANCE_IP: 172.30.73.24
      VAULT_NACOS_INSTANCE_PORT: "18107"
      VAULT_NACOS_USERNAME: mor-test-services
      VAULT_NACOS_PASSWORD: ${MOR_NACOS_SERVICE_PASSWORD:?prepare test secrets}
      OTEL_TRACES_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: ""
      TZ: UTC
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: [CMD, /app/vault-probe]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      backend: { ipv4_address: 172.30.73.24 }

  risk-service:
    <<: *java
    image: mor-test/risk-service:development
    build:
      context: ./artifacts
      dockerfile: ../java/Dockerfile
      args: { JAR_FILE: risk-service.jar }
    environment:
      <<: *discovery
      SERVER_ADDRESS: 0.0.0.0
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.30.73.25
      RISK_DB_URL: jdbc:mysql://mysql:3306/mor_risk?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      RISK_DB_USERNAME: risk_app
      RISK_DB_PASSWORD: ${MOR_RISK_DB_PASSWORD:?prepare test secrets}
      RISK_REDIS_HOST: redis
      RISK_REDIS_PORT: "6379"
      RISK_REDIS_PASSWORD: ${PAYTECH_REDIS_PASSWORD:?prepare test secrets}
      RISK_SNOWFLAKE_REGION_ID: "0"
      RISK_SNOWFLAKE_WORKER_ID: "25"
      RISK_RABBITMQ_HOST: rabbitmq
      RISK_RABBITMQ_PORT: "5672"
      RISK_RABBITMQ_USERNAME: ${MOR_RABBITMQ_USER:?prepare test secrets}
      RISK_RABBITMQ_PASSWORD: ${MOR_RABBITMQ_PASSWORD:?prepare test secrets}
      RISK_RABBITMQ_VHOST: /mor-test
      RISK_DECISION_ENVIRONMENT: TEST
      ONBOARDING_REVIEW_ENABLED: "true"
      ONBOARDING_MATERIALS_ENABLED: "true"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: [CMD, java, -cp, /app/health-probe, LocalHttpHealthProbe, http://127.0.0.1:18104/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      backend: { ipv4_address: 172.30.73.25 }

  platform-support-service:
    <<: *java
    image: mor-test/platform-support-service:development
    build:
      context: ./artifacts
      dockerfile: ../java/Dockerfile
      args: { JAR_FILE: platform-support-service.jar }
    env_file: [./private/platform.env, ./private/client-onboarding.env]
    environment:
      <<: *discovery
      SERVER_ADDRESS: 0.0.0.0
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.30.73.21
      PLATFORM_SUPPORT_DB_URL: jdbc:mysql://mysql:3306/mor_platform?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      PLATFORM_SUPPORT_DB_USERNAME: platform_app
      PLATFORM_SUPPORT_DB_PASSWORD: ${MOR_PLATFORM_DB_PASSWORD:?prepare test secrets}
      PLATFORM_SUPPORT_REDIS_HOST: redis
      PLATFORM_SUPPORT_REDIS_PORT: "6379"
      PLATFORM_SUPPORT_REDIS_PASSWORD: ${PAYTECH_REDIS_PASSWORD:?prepare test secrets}
      OPERATIONS_AUTHENTICATION_ENABLED: "true"
      OPERATIONS_AUTHENTICATION_WORKER_ID: "20"
      # Client 注册与入驻：CUSTOMER 签名/HMAC 材料来自 private/platform.env 的 CLIENT_LOCAL_*。
      CLIENT_AUTHENTICATION_ENABLED: "true"
      CLIENT_AUTHENTICATION_ISSUER: https://customer-auth.mor-test.local
      CLIENT_AUTHENTICATION_PUBLIC_ORIGIN: https://localhost:28443
      # 认证邮件经 Delivery 发送（SMTP 已移除），开启 Client 认证须开启通知。
      # SES 适配器已开启；账号的区域、发件地址与密钥在运营后台维护，SES_PRIMARY 录入发件地址与密钥前认证邮件发送失败只计指标。
      NOTIFICATION_ENABLED: "true"
      NOTIFICATION_SES_ENABLED: "true"
      TENANT_PROJECTION_ENABLED: "true"
      FILES_ONBOARDING_ENABLED: "true"
      FILES_ONBOARDING_STORAGE_PROVIDER: MINIO
      FILES_ONBOARDING_STORAGE_CONTAINER_REF: mor-platform-files
      FILES_ONBOARDING_SCAN_POLICY_CODE: CLIENT_ONBOARDING_FORMAT
      FILES_ONBOARDING_MINIO_ENDPOINT: https://minio.mor-test.localhost:29400
      FILES_ONBOARDING_MINIO_REGION: us-east-1
      FILES_ONBOARDING_MINIO_ACCESS_KEY: ${MOR_MINIO_PLATFORM_ACCESS_KEY:?prepare test secrets}
      FILES_ONBOARDING_MINIO_SECRET_KEY: ${MOR_MINIO_PLATFORM_SECRET_KEY:?prepare test secrets}
      FILES_ONBOARDING_MINIO_TRUSTED_CERTIFICATE: /run/mor-test/test-ca.crt
      COMPENSATION_ENABLED: "true"
      COMPENSATION_INSTANCE_ID: platform-test
    volumes:
      - ./private/test-ca.crt:/run/mor-test/test-ca.crt:ro
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
      redis: { condition: service_healthy }
      vault-service: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: [CMD, java, -cp, /app/health-probe, LocalHttpHealthProbe, http://127.0.0.1:18106/platform-support/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      backend: { ipv4_address: 172.30.73.21 }

  client-contract-service:
    <<: *java
    image: mor-test/client-contract-service:development
    build:
      context: ./artifacts
      dockerfile: ../java/Dockerfile
      args: { JAR_FILE: client-contract-service.jar }
    environment:
      <<: *discovery
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.30.73.26
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mor_cct?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: cct_app
      SPRING_DATASOURCE_PASSWORD: ${MOR_CCT_DB_PASSWORD:?prepare test secrets}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${PAYTECH_REDIS_PASSWORD:?prepare test secrets}
      CCT_RABBITMQ_HOST: rabbitmq
      CCT_RABBITMQ_PORT: "5672"
      CCT_RABBITMQ_USERNAME: ${MOR_RABBITMQ_USER:?prepare test secrets}
      CCT_RABBITMQ_PASSWORD: ${MOR_RABBITMQ_PASSWORD:?prepare test secrets}
      CCT_RABBITMQ_VHOST: /mor-test
      ONBOARDING_DRAFT_ENABLED: "true"
      ONBOARDING_RECOVERY_ENABLED: "true"
      ONBOARDING_ID_DATACENTER: "0"
      ONBOARDING_ID_WORKER: "26"
      COMPENSATION_INSTANCE_ID: cct-test
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }
      vault-service: { condition: service_healthy }
    healthcheck:
      test: [CMD, java, -cp, /app/health-probe, LocalHttpHealthProbe, http://127.0.0.1:18101/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      backend: { ipv4_address: 172.30.73.26 }

  client-console-bff:
    <<: *java
    image: mor-test/client-console-bff:development
    build:
      context: ./artifacts
      dockerfile: ../java/Dockerfile
      args: { JAR_FILE: client-console-bff.jar }
    environment:
      <<: *discovery
      CLIENT_BFF_BIND_ADDRESS: 172.30.73.27
      CLIENT_ONBOARDING_ENABLED: "true"
      CLIENT_CONSOLE_ORIGIN: https://localhost:28443
    depends_on:
      platform-support-service: { condition: service_healthy }
      client-contract-service: { condition: service_healthy }
    healthcheck:
      test: [CMD, java, -cp, /app/health-probe, LocalHttpHealthProbe, http://127.0.0.1:19202/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      backend: { ipv4_address: 172.30.73.27 }

  operations-console-bff:
    <<: *java
    image: mor-test/operations-console-bff:development
    build:
      context: ./artifacts
      dockerfile: ../java/Dockerfile
      args: { JAR_FILE: operations-console-bff.jar }
    environment:
      <<: *discovery
      OPERATIONS_BFF_BIND_ADDRESS: 172.30.73.22
      OPERATIONS_CONSOLE_ORIGIN: http://localhost:28080
      OPERATIONS_TEST_HTTP_ENABLED: "true"
    depends_on:
      platform-support-service: { condition: service_healthy }
      risk-service: { condition: service_healthy }
    healthcheck:
      test: [CMD, java, -cp, /app/health-probe, LocalHttpHealthProbe, http://127.0.0.1:19201/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      backend: { ipv4_address: 172.30.73.22 }

  api-gateway:
    <<: *java
    image: mor-test/api-gateway:development
    build:
      context: ./artifacts
      dockerfile: ../java/Dockerfile
      args: { JAR_FILE: api-gateway.jar }
    environment:
      <<: *discovery
      GATEWAY_BIND_ADDRESS: 172.30.72.3
      SPRING_CLOUD_NACOS_DISCOVERY_IP: 172.30.73.23
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      OPERATIONS_CONSOLE_ORIGIN: http://localhost:28080
      OPERATIONS_TEST_HTTP_ENABLED: "true"
      OPERATIONS_JWT_ISSUER: https://platform-support.local.test
      OPERATIONS_JWT_AUDIENCE: operations-console
      OPERATIONS_GUARD_REDIS_NAMESPACE: test:api-gateway
      OPERATIONS_ACCESS_LOG_HMAC_VERSION: test-access-log-v1
      OPERATIONS_ACCESS_LOG_HMAC_MATERIAL: ${OPERATIONS_ACCESS_LOG_HMAC_MATERIAL:?prepare test secrets}
      GATEWAY_CLIENT_ENABLED: "true"
      GATEWAY_CLIENT_CONSOLE_ORIGIN: https://localhost:28443
      GATEWAY_CLIENT_SECURITY_ISSUER: https://customer-auth.mor-test.local
      GATEWAY_CLIENT_SECURITY_AUDIENCE: client-console
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${PAYTECH_REDIS_PASSWORD:?prepare test secrets}
    depends_on:
      redis: { condition: service_healthy }
      platform-support-service: { condition: service_healthy }
      operations-console-bff: { condition: service_healthy }
      client-console-bff: { condition: service_healthy }
    healthcheck:
      test: [CMD, java, -cp, /app/health-probe, LocalHttpHealthProbe, http://127.0.0.1:19080/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      ingress: { ipv4_address: 172.30.72.3 }
      backend: { ipv4_address: 172.30.73.23 }

  operations-console-web:
    profiles: [applications]
    image: mor-test/operations-console-web:development
    build: ../operations-console-web
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [web]

  client-console-web:
    profiles: [applications]
    image: mor-test/client-console-web:development
    build: ../client-console-web
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [web]

  nginx:
    profiles: [applications]
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    user: nginx
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    # 28080 运营端（HTTP，沿用）；28443 客户端（HTTPS，test CA 签发的 localhost 证书）。
    ports: ["127.0.0.1:28080:8080", "127.0.0.1:28443:8443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./private/tls:/etc/nginx/tls:ro
    depends_on:
      api-gateway: { condition: service_healthy }
      operations-console-web: { condition: service_healthy }
      client-console-web: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      web: {}
      ingress: { ipv4_address: 172.30.72.2 }
