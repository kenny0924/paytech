  operations-console-web:
    profiles: [applications]
    image: mor-test/operations-console-web:development
    build: ../operations-console-web
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [web]

  client-console-web:
    profiles: [applications]
    image: mor-test/client-console-web:development
    build: ../client-console-web
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [web]

  nginx:
    profiles: [applications]
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    user: nginx
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    # 28080 运营端（HTTP，沿用）；28443 客户端（HTTPS，test CA 签发的 localhost 证书）；28444 Client API（HTTPS，同一证书）。
    ports: ["127.0.0.1:28080:8080", "127.0.0.1:28443:8443", "127.0.0.1:28444:8444"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./private/tls:/etc/nginx/tls:ro
    depends_on:
      api-gateway: { condition: service_healthy }
      operations-console-web: { condition: service_healthy }
      client-console-web: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      web: {}
      ingress: { ipv4_address: 172.30.72.2 }
